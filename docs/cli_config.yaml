run-examples:
  elasticsearch:
    url: "http://localhost:9200"
    request_timeout: 10
    esql_timeout: 15
    username: "elastic"
    password: "elastic"
  api-excludes:
    - ".* _inference/.*"   # ML inference endpoints
    - ".* _slm/.*"         # Snapshot lifecycle management
    - ".* _snapshot/.*"    # Snapshot operations
    - ".* _connector/.*"   # connectors overwrite each other and need 3rd party
  code-excludes:
    - "cluster_one:"       # Cross-cluster examples requiring multiple clusters
    - "cluster_two:"       # Cross-cluster examples requiring multiple clusters
    - "\"cluster_one\""    # Remote cluster config (PUT _cluster/settings) that causes 30s timeouts
    - "\\*:my-"            # Wildcard cross-cluster syntax (FROM *:index) that times out
  wipe-indices-between-topics: true
  log-level: DEBUG
  log-to-file: true
  log-filename-with-timestamp: true

import-examples:
  log-level: INFO
