--- !code
|
  GET my-index/_search
  {
    "runtime_mappings": {
      "day_of_week": {
        "type": "keyword",
        "script": {
          "source":
          """emit(doc['@timestamp'].value.dayOfWeekEnum
          .getDisplayName(TextStyle.FULL, Locale.ROOT))"""
        }
      }
    },
    "aggs": {
      "day_of_week": {
        "terms": {
          "field": "day_of_week"
        }
      }
    }
  }
