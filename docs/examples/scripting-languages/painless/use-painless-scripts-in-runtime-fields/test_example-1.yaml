--- !code
|
  PUT my-index/
  {
    "mappings": {
      "runtime": {
        "day_of_week": {
          "type": "keyword",
          "script": {
            "source":
            """emit(doc['@timestamp'].value.dayOfWeekEnum
            .getDisplayName(TextStyle.FULL, Locale.ROOT))"""
          }
        }
      },
      "properties": {
        "@timestamp": {"type": "date"}
      }
    }
  }
