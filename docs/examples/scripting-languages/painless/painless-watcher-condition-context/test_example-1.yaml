--- !metadata
id: example-1
language: elastic_console
topic: painless-watcher-condition-context
subtopic: default
example_order: 1
--- !code
|
  POST _watcher/watch/_execute
  {
    "watch" : {
      "trigger" : { "schedule" : { "interval" : "24h" } },
      "input" : {
        "search" : {
          "request" : {
            "indices" : [ "seats" ],
            "body" : {
              "query" : {
                "term": { "sold": "true"}
              },
              "aggs" : {
                "theatres" : {
                  "terms" : { "field" : "play" },
                  "aggs" : {
                    "money" : {
                      "sum": { "field" : "cost" }
                    }
                  }
                }
              }
            }
          }
        }
      },
      "condition" : {
        "script" :
        """
          return ctx.payload.aggregations.theatres.buckets.stream()       
            .filter(theatre -> theatre.money.value < 15000 ||
                               theatre.money.value > 50000)               
            .count() > 0                                                  
        """
      },
      "actions" : {
        "my_log" : {
          "logging" : {
            "text" : "The output of the search was : {{ctx.payload.aggregations.theatres.buckets}}"
          }
        }
      }
    }
  }
--- !result

