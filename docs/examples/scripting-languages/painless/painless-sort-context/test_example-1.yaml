--- !metadata
id: example-1
language: elastic_console
topic: painless-sort-context
subtopic: default
example_order: 1
--- !code
|
  GET /_search
  {
    "query": {
      "term": {
        "sold": "true"
      }
    },
    "sort": {
      "_script": {
        "type": "number",
        "script": {
          "lang": "painless",
          "source": "doc['theatre'].value.length() * params.factor",
          "params": {
            "factor": 1.1
          }
        },
        "order": "asc"
      }
    }
  }
--- !result

