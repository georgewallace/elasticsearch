--- !code
|
  GET seats/_search
  {
    "size": 2,
    "query": {
      "match_all": {}
    },
    "script_fields": {
      "day-of-week": {
        "script": {
          "source": "doc['datetime'].value.getDayOfWeekEnum().getDisplayName(TextStyle.FULL, Locale.ENGLISH)"
        }
      },
      "number-of-actors": {
        "script": {
          "source": "doc['actors'].size()"
        }
      }
    }
  }
