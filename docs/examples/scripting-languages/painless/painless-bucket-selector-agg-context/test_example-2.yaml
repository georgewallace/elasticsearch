--- !metadata
id: example-2
language: elastic_console
topic: painless-bucket-selector-agg-context
subtopic: default
example_order: 2
--- !code
|
  GET /seats/_search
  {
    "size": 0,
    "aggs": {
      "theatres": {
        "terms": {
          "field": "theatre",
          "size": 10
        },
        "aggs": {
          "max_cost": {
            "max": {
              "field": "cost"
            }
          },
          "filtering_agg": {
            "bucket_selector": {
              "buckets_path": { 
                "max": "max_cost"
              },
              "script": {
                "params": {
                  "base_cost": 5 
                },
                "source": "params.max + params.base_cost > 10"
              }
            }
          }
        }
      }
    }
  }
--- !result

