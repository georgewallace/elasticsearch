  GET /my-index*/_eql/search
  {
    "max_samples_per_key": 2,     
    "size": 20,                   
    "query": """
      sample
        [any where uptime > 0]   by host,os
        [any where port > 100]   by host,op_sys
        [any where bool == true] by host,os
    """
  }
