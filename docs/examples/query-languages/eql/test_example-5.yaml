--- !code
|
  GET /my-data-stream/_eql/search
  {
    "query": """
      sequence with maxspan=1d
        [ process where process.name == "cmd.exe" ]
        ![ process where stringContains(process.command_line, "ocx") ]
        [ file where stringContains(file.name, "scrobj.dll") ]
    """
  }
