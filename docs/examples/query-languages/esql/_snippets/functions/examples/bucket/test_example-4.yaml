example_order: 4
--- !code
|
  FROM employees
  | WHERE hire_date >= "1985-01-01T00:00:00Z" AND hire_date < "1986-01-01T00:00:00Z"
  | STATS hires_per_week = COUNT(*) BY week = BUCKET(hire_date, 1 week)
  | SORT week
--- !result

