--- !code
|
  FROM employees
  | STATS s1 = b1 + 1, s2 = BUCKET(salary / 1000 + 999, 50.) + 2 BY b1 = BUCKET(salary / 100 + 99, 50.), b2 = BUCKET(salary / 1000 + 999, 50.)
  | SORT b1, b2
  | KEEP s1, b1, s2, b2
