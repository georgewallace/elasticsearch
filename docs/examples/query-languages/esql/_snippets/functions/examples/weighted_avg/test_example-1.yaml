--- !metadata
id: example-1
language: esql
topic: weighted_avg
subtopic: default
example_order: 1
--- !code
|
  FROM employees
  | STATS w_avg = WEIGHTED_AVG(salary, height) BY languages
  | EVAL w_avg = ROUND(w_avg)
  | KEEP w_avg, languages
  | SORT languages
--- !result

