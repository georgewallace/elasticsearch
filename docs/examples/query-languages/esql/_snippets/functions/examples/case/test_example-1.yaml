--- !metadata
id: example-1
language: esql
topic: case
subtopic: default
example_order: 1
--- !code
|
  FROM employees
  | EVAL type = CASE(
      languages <= 1, "monolingual",
      languages <= 2, "bilingual",
       "polyglot")
  | KEEP emp_no, languages, type
--- !result

