--- !metadata
id: example-1
language: esql
topic: st_geohash
subtopic: default
example_order: 1
--- !code
|
  FROM airports
  | EVAL geohash = ST_GEOHASH(location, 1)
  | STATS
      count = COUNT(geohash),
      centroid = ST_CENTROID_AGG(location)
        BY geohash
  | WHERE count >= 10
  | EVAL geohashString = TO_STRING(geohash)
  | KEEP count, centroid, geohashString
  | SORT count DESC, geohashString ASC
--- !result

