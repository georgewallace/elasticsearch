--- !metadata
id: example-1
language: esql
topic: aggFiltering
subtopic: default
example_order: 1
--- !code
|
  FROM employees
  | STATS avg50s = AVG(salary)::LONG WHERE birth_date < "1960-01-01",
          avg60s = AVG(salary)::LONG WHERE birth_date >= "1960-01-01"
          BY gender
  | SORT gender
--- !result

