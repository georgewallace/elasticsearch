language: esql
topic: avg-salaries-where
subtopic: default
example_order: 1
--- !code
|
  FROM employees
  | KEEP emp_no, salary
  | INLINE STATS avg_lt_50 = ROUND(AVG(salary)) WHERE salary < 50000,
                 avg_lt_60 = ROUND(AVG(salary)) WHERE salary >=50000 AND salary < 60000,
                 avg_gt_60 = ROUND(AVG(salary)) WHERE salary >= 60000
--- !result

