--- !code
|
  FROM books
  | WHERE title:"search query"
  | SORT _score DESC
  | LIMIT 100  // Limit to top 100 results before reranking
  | RERANK "search query" ON title WITH { "inference_id" : "my_rerank_endpoint" }
--- !result

