--- !code
|
  FROM web-logs
  | WHERE @timestamp > NOW() - 24 hours
  | STATS
      requests = COUNT(*),
      unique_ips = COUNT_DISTINCT(client.ip)
    BY bucket = DATE_TRUNC(1 hour, @timestamp)
  | SORT bucket DESC
--- !result

