--- !code
|
  FROM logs-*
  | WHERE @timestamp > NOW() - 1 hour
  | WHERE log.level == "error"
  | KEEP @timestamp, message, host.name, service.name, error.message
  | SORT @timestamp DESC
  | LIMIT 100
--- !result

