language: esql
topic: esql-query-tips
subtopic: default
example_order: 17
--- !code
|
  FROM metrics-*
  | WHERE @timestamp > NOW() - 15 minutes
  | STATS
      avg_cpu = AVG(system.cpu.percent),
      avg_mem = AVG(system.memory.used.pct),
      host_count = COUNT_DISTINCT(host.name)
    BY service.name
  | SORT avg_cpu DESC
--- !result

