--- !code
|
  FROM logs-*
  | WHERE @timestamp > NOW() - 24 hours
  | STATS request_count = COUNT(*) BY bucket = DATE_TRUNC(1 hour, @timestamp)
  | SORT bucket ASC
--- !result

