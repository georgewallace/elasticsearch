--- !metadata
id: example-1
language: esql
topic: multi_match
subtopic: default
example_order: 1
--- !code
|
  FROM books
  | WHERE MULTI_MATCH("Faulkner", author, description)
  | KEEP book_no, author
  | SORT book_no
  | LIMIT 5
--- !result

