--- !metadata
id: example-1
language: esql
topic: bit_length
subtopic: default
example_order: 1
--- !code
|
  FROM airports
  | WHERE country == "India"
  | KEEP city
  | EVAL fn_length = LENGTH(city), fn_bit_length = BIT_LENGTH(city)
--- !result

