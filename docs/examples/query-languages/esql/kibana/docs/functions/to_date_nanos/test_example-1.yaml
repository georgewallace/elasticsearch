--- !metadata
id: example-1
language: esql
topic: to_date_nanos
subtopic: default
example_order: 1
--- !code
|
  FROM date_nanos
  | WHERE MV_MIN(nanos) < TO_DATE_NANOS("2023-10-23T12:27:28.948Z")
      AND millis > "2000-01-01"
  | SORT nanos DESC
--- !result

