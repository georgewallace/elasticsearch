--- !code
|
  POST /_query
  {
     "query": """
     FROM employees
     | WHERE hire_date >= "1985-01-01T00:00:00Z" AND hire_date < "1986-01-01T00:00:00Z"
     | STATS hires_per_week = COUNT(*) BY week = BUCKET(hire_date, ?timespan)
     | SORT week
     """,
     "params": [{"timespan" : "1 week"}]
  }
--- !result

