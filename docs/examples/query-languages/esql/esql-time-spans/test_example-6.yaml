--- !code
|
  POST /_query
  {
     "query": """
     FROM employees
     | KEEP first_name, last_name, hire_date
     | EVAL year_hired = DATE_TRUNC(?timespan, hire_date)
     """,
     "params": [{"timespan" : "1 year"}]
  }
