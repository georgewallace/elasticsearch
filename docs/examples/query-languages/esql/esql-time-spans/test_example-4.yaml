--- !code
|
  POST /_query
  {
     "query": """
     FROM employees
     | EVAL x = hire_date + ?timespan::DATE_PERIOD, y = hire_date - TO_DATEPERIOD(?timespan)
     """,
     "params": [{"timespan" : "1 day"}]
  }
