--- !code
|
  PUT /mv
  {
    "mappings": {
      "properties": {
        "b": {"type": "keyword"}
      }
    }
  }

  POST /mv/_bulk?refresh
  { "index" : {} }
  { "a": 1, "b": ["foo", "foo", "bar"] }
  { "index" : {} }
  { "a": 2, "b": ["bar", "bar"] }

  POST /_query
  {
    "query": "FROM mv | LIMIT 2"
  }
--- !result
|
  {
    "took": 28,
    "is_partial": false,
    "columns": [
      { "name": "a", "type": "long"},
      { "name": "b", "type": "keyword"}
    ],
    "values": [
      [1, ["bar", "foo"]],
      [2,          "bar"]
    ]
  }
