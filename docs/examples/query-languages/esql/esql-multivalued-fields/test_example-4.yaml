--- !code
|
  PUT /mv
  {
    "mappings": {
      "properties": {
        "b": {"type": "long"}
      }
    }
  }

  POST /mv/_bulk?refresh
  { "index" : {} }
  { "a": 1, "b": [2, 2, 1] }
  { "index" : {} }
  { "a": 2, "b": [1, 1] }

  POST /_query
  {
    "query": "FROM mv | EVAL b=TO_STRING(b) | LIMIT 2"
  }
--- !result
|
  {
    "took": 28,
    "is_partial": false,
