--- !code
|
  POST /_query
  {
    "query": """
      FROM library
      | EVAL year = DATE_EXTRACT("year", release_date)
      | WHERE page_count > ? AND author == ?
      | STATS count = COUNT(*) by year
      | WHERE count > ?
      | LIMIT 5
    """,
    "params": [300, "Frank Herbert", 0]
  }
