--- !code
|
  POST /_query
  {
    "query": """
      FROM library
      | EVAL year = DATE_EXTRACT("year", release_date)
      | WHERE page_count > 300 AND author == "Frank Herbert"
      | STATS count = COUNT(*) by year
      | WHERE count > 0
      | LIMIT 5
    """
  }
--- !result

