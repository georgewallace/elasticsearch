--- !code
|
  POST /_query?format=txt
  {
    "query": """
      FROM library
      | KEEP author, name, page_count, release_date
      | SORT page_count DESC
      | LIMIT 5
    """,
    "filter": {
      "range": {
        "page_count": {
          "gte": 100,
          "lte": 200
        }
      }
    }
  }
--- !result

