--- !code
|
  FROM cooking_blog
  | WHERE category.keyword == "Dessert"
  | LIMIT 3
  | EVAL prompt = CONCAT("Summarize this recipe: ", title, " - ", description)
  | COMPLETION summary = prompt WITH { "inference_id": "my_llm_endpoint" }
  | KEEP title, summary
--- !result

