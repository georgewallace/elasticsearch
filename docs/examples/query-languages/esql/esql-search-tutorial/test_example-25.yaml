--- !code
|
  FROM cooking_blog METADATA _id, _index, _score
  | FORK (
      WHERE title:"vegetarian curry" 
      | SORT _score DESC
      | LIMIT 5
  ) (
      WHERE semantic_description:"easy vegetarian curry recipes" 
      | SORT _score DESC
      | LIMIT 5
  )
  | FUSE 
  | KEEP title, description, rating, _score
  | SORT _score DESC
  | LIMIT 5
--- !result

