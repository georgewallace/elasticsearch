--- !code
|
  FROM cooking_blog METADATA _score
  | WHERE description:"vegetarian recipes" 
  | SORT _score DESC
  | LIMIT 100 
  | RERANK "healthy quick meals" ON description 
  | LIMIT 5 
  | KEEP title, description, _score
