--- !metadata
id: example-5
language: elastic_console
topic: query-dsl-text-expansion-query
subtopic: default
example_order: 5
--- !code
|
  GET my-index/_search
  {
     "query":{
        "text_expansion":{
           "ml.tokens":{
              "model_id":".elser_model_2",
              "model_text":"How is the weather in Jamaica?",
              "pruning_config": {
                 "tokens_freq_ratio_threshold": 5,
                 "tokens_weight_threshold": 0.4,
                 "only_score_pruned_tokens": false
             }
           }
        }
     },
     "rescore": {
        "window_size": 100,
        "query": {
           "rescore_query": {
              "text_expansion": {
                 "ml.tokens": {
                    "model_id": ".elser_model_2",
                    "model_text": "How is the weather in Jamaica?",
                    "pruning_config": {
                       "tokens_freq_ratio_threshold": 5,
                       "tokens_weight_threshold": 0.4,
                       "only_score_pruned_tokens": true
                    }
                 }
              }
           }
        }
     }
  }
--- !result

