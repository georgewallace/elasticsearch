--- !metadata
id: example-4
language: elastic_console
topic: query-dsl-text-expansion-query
subtopic: default
example_order: 4
--- !code
|
  GET my-index/_search
  {
    "retriever": {
      "rrf": {
        "retrievers": [
          {
            "standard": {
              "query": {
                "multi_match": {
                  "query": "How is the weather in Jamaica?",
                  "fields": [
                    "title",
                    "description"
                  ]
                }
              }
            }
          },
          {
            "standard": {
              "query": {
                "text_expansion": {
                  "ml.inference.title_expanded.predicted_value": {
                    "model_id": ".elser_model_2",
                    "model_text": "How is the weather in Jamaica?"
                  }
                }
              }
            }
          },
          {
            "standard": {
              "query": {
                "text_expansion": {
                  "ml.inference.description_expanded.predicted_value": {
                    "model_id": ".elser_model_2",
                    "model_text": "How is the weather in Jamaica?"
                  }
                }
              }
            }
          }
        ],
        "window_size": 10,
        "rank_constant": 20
      }
    }
  }
--- !result

