--- !code
|
  PUT /shapes
  {
    "mappings": {
      "properties": {
        "geometry": {
          "type": "shape"
        }
      }
    }
  }

  PUT /shapes/_doc/footprint
  {
    "geometry": {
      "type": "envelope",
      "coordinates": [ [ 1355.0, 5355.0 ], [ 1400.0, 5200.0 ] ]
    }
  }

  GET /example/_search
  {
    "query": {
      "shape": {
        "geometry": {
          "indexed_shape": {
            "index": "shapes",
            "id": "footprint",
            "path": "geometry"
          }
        }
      }
    }
  }
