--- !code
|
  GET my-index/_search
  {
    "retriever": {
      "rrf": {
        "retrievers": [
          {
            "standard": {
              "query": {
                "term": {
                  "text": "shoes"
                }
              }
            }
          },
          {
            "standard": {
              "query": {
                "semantic": {
                  "field": "semantic_field",
                  "query": "shoes"
                }
              }
            }
          }
        ],
        "rank_window_size": 50,
        "rank_constant": 20
      }
    }
  }
