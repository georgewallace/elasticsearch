# Source: query-languages/query-dsl/query-dsl-geo-shape-query.md
--- !metadata
id: example-5
language: elastic_console
topic: query-dsl-geo-shape-query
subtopic: default
example_order: 5
--- !code
|
  PUT /shapes
  {
    "mappings": {
      "properties": {
        "location": {
          "type": "geo_shape"
        }
      }
    }
  }

  PUT /shapes/_doc/deu
  {
    "location": {
      "type": "envelope",
      "coordinates" : [[13.0, 53.0], [14.0, 52.0]]
    }
  }

  GET /example/_search
  {
    "query": {
      "bool": {
        "filter": {
          "geo_shape": {
            "location": {
              "indexed_shape": {
                "index": "shapes",
                "id": "deu",
                "path": "location"
              }
            }
          }
        }
      }
    }
  }
--- !result

