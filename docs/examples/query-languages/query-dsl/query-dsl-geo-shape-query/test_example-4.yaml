--- !metadata
id: example-4
language: elastic_console
topic: query-dsl-geo-shape-query
subtopic: default
example_order: 4
--- !code
|
  GET /example_points/_search
  {
    "query": {
      "bool": {
        "must": {
          "match_all": {}
        },
        "filter": {
          "geo_shape": {
            "location": {
              "shape": {
                "type": "envelope",
                "coordinates": [ [ 13.0, 53.0 ], [ 14.0, 52.0 ] ]
              },
              "relation": "intersects"
            }
          }
        }
      }
    }
  }
