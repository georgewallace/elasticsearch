language: elastic_console
topic: full-text-filter-tutorial
subtopic: default
example_order: 12
--- !code
|
  GET /cooking_blog/_search
  {
    "query": {
      "bool": {
        "must": [
          { "term": { "tags": "vegetarian" } },
          {
            "range": {
              "rating": {
                "gte": 4.5
              }
            }
          }
        ],
        "should": [
          {
            "term": {
              "category.keyword": "Main Course"
            }
          },
          {
            "multi_match": {
              "query": "curry spicy",
              "fields": [
                "title^2",
                "description"
              ]
            }
          },
          {
            "range": {
              "date": {
                "gte": "now-1M/d"
              }
            }
          }
        ],
        "must_not": [ 
          {
            "term": {
              "category.keyword": "Dessert"
            }
          }
        ]
      }
    }
  }
