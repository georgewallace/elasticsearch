--- !metadata
id: example-4
language: elastic_console
topic: query-dsl-sparse-vector-query
subtopic: default
example_order: 4
--- !code
|
  GET my-index/_search
  {
    "query": {
      "bool": {
        "should": [
          {
            "sparse_vector": {
              "field": "ml.inference.title_expanded.predicted_value",
              "inference_id": "my-elser-model",
              "query": "How is the weather in Jamaica?",
              "boost": 1
            }
          },
          {
            "sparse_vector": {
              "field": "ml.inference.description_expanded.predicted_value",
              "inference_id": "my-elser-model",
              "query": "How is the weather in Jamaica?",
              "boost": 1
            }
          },
          {
            "multi_match": {
              "query": "How is the weather in Jamaica?",
              "fields": [
                "title",
                "description"
              ],
              "boost": 4
            }
          }
        ]
      }
    }
  }
--- !result

