--- !code
|
  GET /_search
  {
    "query": {
      "more_like_this": {
        "fields": [ "title", "description" ],
        "like": [
          {
            "_index": "imdb",
            "_id": "1"
          },
          {
            "_index": "imdb",
            "_id": "2"
          },
          "and potentially some more text here as well"
        ],
        "min_term_freq": 1,
        "max_query_terms": 12
      }
    }
  }
