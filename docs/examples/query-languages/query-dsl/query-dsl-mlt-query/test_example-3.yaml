example_order: 3
--- !code
|
  GET /_search
  {
    "query": {
      "more_like_this": {
        "fields": [ "name.first", "name.last" ],
        "like": [
          {
            "_index": "marvel",
            "doc": {
              "name": {
                "first": "Ben",
                "last": "Grimm"
              },
              "_doc": "You got no idea what I'd... what I'd give to be invisible."
            }
          },
          {
            "_index": "marvel",
            "_id": "2"
          }
        ],
        "min_term_freq": 1,
        "max_query_terms": 12
      }
    }
  }
--- !result

