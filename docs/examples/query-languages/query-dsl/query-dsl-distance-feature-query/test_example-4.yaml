--- !code
|
  GET /items/_search
  {
    "query": {
      "bool": {
        "must": {
          "match": {
            "name": "chocolate"
          }
        },
        "should": {
          "distance_feature": {
            "field": "location",
            "pivot": "1000m",
            "origin": [-71.3, 41.15]
          }
        }
      }
    }
  }
--- !result

