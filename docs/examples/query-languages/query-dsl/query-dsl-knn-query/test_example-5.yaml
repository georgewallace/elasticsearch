--- !code
|
  POST my-image-index/_search
  {
    "size" : 3,
    "query": {
      "bool": {
        "should": [
          {
            "match": {
              "title": {
                "query": "mountain lake",
                "boost": 1
              }
            }
          },
          {
            "knn": {
              "field": "image-vector",
              "query_vector": [-5, 9, -12],
              "k": 10,
              "boost": 2
            }
          }
        ]
      }
    }
  }
