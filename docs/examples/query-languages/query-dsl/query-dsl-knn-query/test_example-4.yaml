--- !metadata
id: example-4
language: elastic_console
topic: query-dsl-knn-query
subtopic: default
example_order: 4
--- !code
|
  POST my-image-index/_search
  {
    "size" : 10,
    "query" : {
      "bool" : {
        "must" : {
          "knn": {
            "field": "image-vector",
            "query_vector": [-5, 9, -12],
            "k": 3
          }
        },
        "filter" : {
          "term" : { "file-type" : "png" }
        }
      }
    }
  }
--- !result

