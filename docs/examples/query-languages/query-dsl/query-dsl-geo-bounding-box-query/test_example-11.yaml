--- !code
|
  GET my_locations/_search
  {
    "query": {
      "bool": {
        "must": {
          "match_all": {}
        },
        "filter": {
          "geo_bounding_box": {
            "pin.location": {
              "top": 40.73,
              "left": -74.1,
              "bottom": 40.01,
              "right": -71.12
            }
          }
        }
      }
    }
  }
--- !result

