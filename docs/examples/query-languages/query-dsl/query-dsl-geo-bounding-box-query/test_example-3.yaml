--- !metadata
id: example-3
language: elastic_console
topic: query-dsl-geo-bounding-box-query
subtopic: default
example_order: 3
--- !code
|
  GET my_geoshapes/_search
  {
    "query": {
      "bool": {
        "must": {
          "match_all": {}
        },
        "filter": {
          "geo_bounding_box": {
            "pin.location": {
              "top_left": {
                "lat": 40.73,
                "lon": -74.1
              },
              "bottom_right": {
                "lat": 40.01,
                "lon": -71.12
              }
            }
          }
        }
      }
    }
  }
--- !result

