--- !code
|
  GET /drivers/_search
  {
    "query": {
      "nested": {
        "path": "driver",
        "query": {
          "nested": {
            "path": "driver.vehicle",
            "query": {
              "bool": {
                "must": [
                  { "match": { "driver.vehicle.make": "Powell Motors" } },
                  { "match": { "driver.vehicle.model": "Canyonero" } }
                ]
              }
            }
          }
        }
      }
    }
  }
