--- !code
|
  GET /test/_search
  {
    "query": {
      "bool": {
        "must": [
          {
            "match": {
              "content": "2016"
            }
          }
        ],
        "should": [
          {
            "rank_feature": {
              "field": "pagerank"
            }
          },
          {
            "rank_feature": {
              "field": "url_length",
              "boost": 0.1
            }
          },
          {
            "rank_feature": {
              "field": "topics.sports",
              "boost": 0.4
            }
          }
        ]
      }
    }
  }
