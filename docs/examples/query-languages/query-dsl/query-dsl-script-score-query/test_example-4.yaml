--- !code
|
  GET my-index-000001/_search
  {
    "query": {
      "script_score": {
        "query" : {
          "bool" : {
            "filter" : {
              "term" : {
                "status" : "published"
              }
            }
          }
        },
        "script": {
          "source": """
            double value = dotProduct(params.query_vector, 'my_dense_vector');
            return sigmoid(1, Math.E, -value); 
          """,
          "params": {
            "query_vector": [4, 3.4, -0.2]
          }
        }
      }
    }
  }
--- !result

