--- !code
|
  GET my-index-000001/_search
  {
    "query": {
      "script_score": {
        "query" : {
          "bool" : {
            "filter" : {
              "term" : {
                "status" : "published"
              }
            }
          }
        },
        "script": {
          "source": "(24 - hamming(params.queryVector, 'my_byte_dense_vector')) / 24", 
          "params": {
            "queryVector": [4, 3, 0]
          }
        }
      }
    }
  }
--- !result

