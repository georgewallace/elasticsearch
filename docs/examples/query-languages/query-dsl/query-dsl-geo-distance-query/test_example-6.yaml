--- !code
|
  GET /my_locations/_search
  {
    "query": {
      "bool": {
        "must": {
          "match_all": {}
        },
        "filter": {
          "geo_distance": {
            "distance": "12km",
            "pin.location": [ -70, 40 ]
          }
        }
      }
    }
  }
--- !result

