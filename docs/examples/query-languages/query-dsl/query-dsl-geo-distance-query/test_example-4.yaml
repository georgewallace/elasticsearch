example_order: 4
--- !code
|
  GET my_locations,my_geoshapes/_search
  {
    "query": {
      "bool": {
        "must": {
          "match_all": {}
        },
        "filter": {
          "geo_distance": {
            "distance": "200km",
            "pin.location": {
              "lat": 40,
              "lon": -70
            }
          }
        }
      }
    }
  }
--- !result

