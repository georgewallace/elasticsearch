--- !metadata
id: example-1
language: elastic_console
topic: query-dsl-geo-polygon-query
subtopic: default
example_order: 1
--- !code
|
  GET /_search
  {
    "query": {
      "bool": {
        "must": {
          "match_all": {}
        },
        "filter": {
          "geo_polygon": {
            "person.location": {
              "points": [
                { "lat": 40, "lon": -70 },
                { "lat": 30, "lon": -80 },
                { "lat": 20, "lon": -90 }
              ]
            }
          }
        }
      }
    }
  }
--- !result

