--- !code
|
  GET /_search
  {
    "query": {
      "bool": {
        "must": {
          "match_all": {}
        },
        "filter": {
          "geo_polygon": {
            "person.location": {
              "points": [
                "drn5x1g8cu2y",
                "30, -80",
                "20, -90"
              ]
            }
          }
        }
      }
    }
  }
--- !result

