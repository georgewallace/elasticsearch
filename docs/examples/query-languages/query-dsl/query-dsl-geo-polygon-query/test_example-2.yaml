--- !code
|
  GET /_search
  {
    "query": {
      "bool": {
        "must": {
          "match_all": {}
        },
        "filter": {
          "geo_polygon": {
            "person.location": {
              "points": [
                [ -70, 40 ],
                [ -80, 30 ],
                [ -90, 20 ]
              ]
            }
          }
        }
      }
    }
  }
--- !result

