--- !code
|
  GET /_search
  {
    "query": {
      "regexp": {
        "user.id": {
          "value": "k.*y",
          "flags": "ALL",
          "case_insensitive": true,
          "max_determinized_states": 10000,
          "rewrite": "constant_score_blended"
        }
      }
    }
  }
--- !result

