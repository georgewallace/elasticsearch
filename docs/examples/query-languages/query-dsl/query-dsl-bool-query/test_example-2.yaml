--- !code
|
  GET /_search
  {
    "query": {
      "bool": {
        "must": [ 
          {
            "bool": {
              "should": [
                { "match": { "user.id": "kimchy" }},
                { "match": { "user.id": "banon" }}
              ]
            }
          },
          { "match": { "tags": "production" }}
        ],
        "should": [ 
          {
            "bool": {
              "must": [
                { "match": { "status": "active" }},
                { "match": { "title": "quick brown fox" }}
              ]
            }
          }
        ]
      }
    }
  }
