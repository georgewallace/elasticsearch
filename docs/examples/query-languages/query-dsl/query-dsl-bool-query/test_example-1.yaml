--- !code
|
  POST _search
  {
    "query": {
      "bool" : {
        "must" : {
          "term" : { "user.id" : "kimchy" }
        },
        "filter": {
          "term" : { "tags" : "production" }
        },
        "must_not" : {
          "range" : {
            "age" : { "gte" : 10, "lte" : 20 }
          }
        },
        "should" : [
          { "term" : { "tags" : "env1" } },
          { "term" : { "tags" : "deployed" } }
        ],
        "minimum_should_match" : 1,
        "boost" : 1.0
      }
    }
  }
