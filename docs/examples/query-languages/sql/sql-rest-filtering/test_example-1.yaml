--- !code
|
  POST /_sql?format=txt
  {
    "query": "SELECT * FROM library ORDER BY page_count DESC",
    "filter": {
      "range": {
        "page_count": {
          "gte" : 100,
          "lte" : 200
        }
      }
    },
    "fetch_size": 5
  }
--- !result

