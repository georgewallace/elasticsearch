|
  SELECT HISTOGRAM(salary % 100, 10) AS h, COUNT(*) AS c FROM emp GROUP BY h;

         h       |       c
  ---------------+---------------
  0              |10
  10             |15
  20             |10
  30             |14
  40             |9
  50             |9
  60             |8
  70             |13
  80             |3
  90             |9
