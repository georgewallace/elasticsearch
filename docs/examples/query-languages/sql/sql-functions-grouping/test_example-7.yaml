--- !code
|
  SELECT HISTOGRAM(MONTH(birth_date), 2) AS h, COUNT(*) as c FROM emp GROUP BY h ORDER BY h DESC;

         h       |       c
  ---------------+---------------
  12             |7
  10             |17
  8              |16
  6              |16
  4              |18
  2              |10
  0              |6
  null           |10
