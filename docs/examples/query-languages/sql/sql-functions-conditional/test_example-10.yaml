--- !code
|
  SELECT count(*) AS count,
    CASE WHEN NVL(languages, 0) = 0 THEN 'zero'
      WHEN languages = 1 THEN 'one'
      WHEN languages = 2 THEN 'bilingual'
      WHEN languages = 3 THEN 'trilingual'
      ELSE 'multilingual'
    END as lang_skills
  FROM employees
  GROUP BY lang_skills
  ORDER BY lang_skills;
--- !result

