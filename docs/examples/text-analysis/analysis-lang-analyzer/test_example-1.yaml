--- !metadata
id: example-1
language: elastic_console
topic: analysis-lang-analyzer
subtopic: default
example_order: 1
--- !code
|
  PUT /arabic_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "arabic_stop": {
            "type":       "stop",
            "stopwords":  "_arabic_" 
          },
          "arabic_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["مثال"] 
          },
          "arabic_stemmer": {
            "type":       "stemmer",
            "language":   "arabic"
          }
        },
        "analyzer": {
          "rebuilt_arabic": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "decimal_digit",
              "arabic_stop",
              "arabic_normalization",
              "arabic_keywords",
              "arabic_stemmer"
            ]
          }
        }
      }
    }
  }
