--- !metadata
id: example-15
language: elastic_console
topic: analysis-lang-analyzer
subtopic: default
example_order: 15
--- !code
|
  PUT /french_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "french_elision": {
            "type":         "elision",
            "articles_case": true,
            "articles": [
                "l", "m", "t", "qu", "n", "s",
                "j", "d", "c", "jusqu", "quoiqu",
                "lorsqu", "puisqu"
              ]
          },
          "french_stop": {
            "type":       "stop",
            "stopwords":  "_french_" 
          },
          "french_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["Example"] 
          },
          "french_stemmer": {
            "type":       "stemmer",
            "language":   "light_french"
          }
        },
        "analyzer": {
          "rebuilt_french": {
            "tokenizer":  "standard",
            "filter": [
              "french_elision",
              "lowercase",
              "french_stop",
              "french_keywords",
              "french_stemmer"
            ]
          }
        }
      }
    }
  }
--- !result

