--- !code
|
  PUT /german_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "german_stop": {
            "type":       "stop",
            "stopwords":  "_german_" 
          },
          "german_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["Beispiel"] 
          },
          "german_stemmer": {
            "type":       "stemmer",
            "language":   "light_german"
          }
        },
        "analyzer": {
          "rebuilt_german": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "german_stop",
              "german_keywords",
              "german_normalization",
              "german_stemmer"
            ]
          }
        }
      }
    }
  }
