--- !metadata
id: example-11
language: elastic_console
topic: analysis-lang-analyzer
subtopic: default
example_order: 11
--- !code
|
  PUT /dutch_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "dutch_stop": {
            "type":       "stop",
            "stopwords":  "_dutch_" 
          },
          "dutch_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["voorbeeld"] 
          },
          "dutch_stemmer": {
            "type":       "stemmer",
            "language":   "dutch"
          },
          "dutch_override": {
            "type":       "stemmer_override",
            "rules": [
              "fiets=>fiets",
              "bromfiets=>bromfiets",
              "ei=>eier",
              "kind=>kinder"
            ]
          }
        },
        "analyzer": {
          "rebuilt_dutch": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "dutch_stop",
              "dutch_keywords",
              "dutch_override",
              "dutch_stemmer"
            ]
          }
        }
      }
    }
  }
--- !result

