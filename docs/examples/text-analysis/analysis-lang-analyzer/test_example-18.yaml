--- !metadata
id: example-18
language: elastic_console
topic: analysis-lang-analyzer
subtopic: default
example_order: 18
--- !code
|
  PUT /greek_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "greek_stop": {
            "type":       "stop",
            "stopwords":  "_greek_" 
          },
          "greek_lowercase": {
            "type":       "lowercase",
            "language":   "greek"
          },
          "greek_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["παράδειγμα"] 
          },
          "greek_stemmer": {
            "type":       "stemmer",
            "language":   "greek"
          }
        },
        "analyzer": {
          "rebuilt_greek": {
            "tokenizer":  "standard",
            "filter": [
              "greek_lowercase",
              "greek_stop",
              "greek_keywords",
              "greek_stemmer"
            ]
          }
        }
      }
    }
  }
--- !result

