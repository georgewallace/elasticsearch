--- !code
|
  PUT /cjk_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "english_stop": {
            "type":       "stop",
            "stopwords":  [ 
              "a", "and", "are", "as", "at", "be", "but", "by", "for",
              "if", "in", "into", "is", "it", "no", "not", "of", "on",
              "or", "s", "such", "t", "that", "the", "their", "then",
              "there", "these", "they", "this", "to", "was", "will",
              "with", "www"
            ]
          }
        },
        "analyzer": {
          "rebuilt_cjk": {
            "tokenizer":  "standard",
            "filter": [
              "cjk_width",
              "lowercase",
              "cjk_bigram",
              "english_stop"
            ]
          }
        }
      }
    }
  }
--- !result

