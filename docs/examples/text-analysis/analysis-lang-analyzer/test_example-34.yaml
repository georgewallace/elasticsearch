--- !code
|
  PUT /swedish_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "swedish_stop": {
            "type":       "stop",
            "stopwords":  "_swedish_" 
          },
          "swedish_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["exempel"] 
          },
          "swedish_stemmer": {
            "type":       "stemmer",
            "language":   "swedish"
          }
        },
        "analyzer": {
          "rebuilt_swedish": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "swedish_stop",
              "swedish_keywords",
              "swedish_stemmer"
            ]
          }
        }
      }
    }
  }
