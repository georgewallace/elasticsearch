--- !metadata
id: example-14
language: elastic_console
topic: analysis-lang-analyzer
subtopic: default
example_order: 14
--- !code
|
  PUT /finnish_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "finnish_stop": {
            "type":       "stop",
            "stopwords":  "_finnish_" 
          },
          "finnish_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["esimerkki"] 
          },
          "finnish_stemmer": {
            "type":       "stemmer",
            "language":   "finnish"
          }
        },
        "analyzer": {
          "rebuilt_finnish": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "finnish_stop",
              "finnish_keywords",
              "finnish_stemmer"
            ]
          }
        }
      }
    }
  }
