--- !metadata
id: example-35
language: elastic_console
topic: analysis-lang-analyzer
subtopic: default
example_order: 35
--- !code
|
  PUT /turkish_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "turkish_stop": {
            "type":       "stop",
            "stopwords":  "_turkish_" 
          },
          "turkish_lowercase": {
            "type":       "lowercase",
            "language":   "turkish"
          },
          "turkish_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["örnek"] 
          },
          "turkish_stemmer": {
            "type":       "stemmer",
            "language":   "turkish"
          }
        },
        "analyzer": {
          "rebuilt_turkish": {
            "tokenizer":  "standard",
            "filter": [
              "apostrophe",
              "turkish_lowercase",
              "turkish_stop",
              "turkish_keywords",
              "turkish_stemmer"
            ]
          }
        }
      }
    }
  }
--- !result

