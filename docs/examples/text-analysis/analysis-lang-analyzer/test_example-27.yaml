--- !metadata
id: example-27
language: elastic_console
topic: analysis-lang-analyzer
subtopic: default
example_order: 27
--- !code
|
  PUT /persian_example
  {
    "settings": {
      "analysis": {
        "char_filter": {
          "zero_width_spaces": {
              "type":       "mapping",
              "mappings": [ "\\u200C=>\\u0020"] 
          }
        },
        "filter": {
          "persian_stop": {
            "type":       "stop",
            "stopwords":  "_persian_" 
          }
        },
        "analyzer": {
          "rebuilt_persian": {
            "tokenizer":     "standard",
            "char_filter": [ "zero_width_spaces" ],
            "filter": [
              "lowercase",
              "decimal_digit",
              "arabic_normalization",
              "persian_normalization",
              "persian_stop",
              "persian_stem"
            ]
          }
        }
      }
    }
  }
--- !result

