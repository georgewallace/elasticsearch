# Source: text-analysis/analysis-lang-analyzer.md
--- !metadata
id: example-7
language: elastic_console
topic: analysis-lang-analyzer
subtopic: default
example_order: 7
--- !code
|
  PUT /catalan_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "catalan_elision": {
            "type":       "elision",
            "articles":   [ "d", "l", "m", "n", "s", "t"],
            "articles_case": true
          },
          "catalan_stop": {
            "type":       "stop",
            "stopwords":  "_catalan_" 
          },
          "catalan_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["example"] 
          },
          "catalan_stemmer": {
            "type":       "stemmer",
            "language":   "catalan"
          }
        },
        "analyzer": {
          "rebuilt_catalan": {
            "tokenizer":  "standard",
            "filter": [
              "catalan_elision",
              "lowercase",
              "catalan_stop",
              "catalan_keywords",
              "catalan_stemmer"
            ]
          }
        }
      }
    }
  }
--- !result

