--- !code
|
  PUT /estonian_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "estonian_stop": {
            "type":       "stop",
            "stopwords":  "_estonian_" 
          },
          "estonian_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["näide"] 
          },
          "estonian_stemmer": {
            "type":       "stemmer",
            "language":   "estonian"
          }
        },
        "analyzer": {
          "rebuilt_estonian": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "estonian_stop",
              "estonian_keywords",
              "estonian_stemmer"
            ]
          }
        }
      }
    }
  }
--- !result

