--- !code
|
  PUT /hungarian_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "hungarian_stop": {
            "type":       "stop",
            "stopwords":  "_hungarian_" 
          },
          "hungarian_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["példa"] 
          },
          "hungarian_stemmer": {
            "type":       "stemmer",
            "language":   "hungarian"
          }
        },
        "analyzer": {
          "rebuilt_hungarian": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "hungarian_stop",
              "hungarian_keywords",
              "hungarian_stemmer"
            ]
          }
        }
      }
    }
  }
