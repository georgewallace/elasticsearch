--- !code
|
  PUT /norwegian_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "norwegian_stop": {
            "type":       "stop",
            "stopwords":  "_norwegian_" 
          },
          "norwegian_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["eksempel"] 
          },
          "norwegian_stemmer": {
            "type":       "stemmer",
            "language":   "norwegian"
          }
        },
        "analyzer": {
          "rebuilt_norwegian": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "norwegian_stop",
              "norwegian_keywords",
              "norwegian_stemmer"
            ]
          }
        }
      }
    }
  }
