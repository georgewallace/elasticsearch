--- !code
|
  PUT /sorani_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "sorani_stop": {
            "type":       "stop",
            "stopwords":  "_sorani_" 
          },
          "sorani_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["mînak"] 
          },
          "sorani_stemmer": {
            "type":       "stemmer",
            "language":   "sorani"
          }
        },
        "analyzer": {
          "rebuilt_sorani": {
            "tokenizer":  "standard",
            "filter": [
              "sorani_normalization",
              "lowercase",
              "decimal_digit",
              "sorani_stop",
              "sorani_keywords",
              "sorani_stemmer"
            ]
          }
        }
      }
    }
  }
