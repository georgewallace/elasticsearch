--- !metadata
id: example-16
language: elastic_console
topic: analysis-lang-analyzer
subtopic: default
example_order: 16
--- !code
|
  PUT /galician_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "galician_stop": {
            "type":       "stop",
            "stopwords":  "_galician_" 
          },
          "galician_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["exemplo"] 
          },
          "galician_stemmer": {
            "type":       "stemmer",
            "language":   "galician"
          }
        },
        "analyzer": {
          "rebuilt_galician": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "galician_stop",
              "galician_keywords",
              "galician_stemmer"
            ]
          }
        }
      }
    }
  }
--- !result

