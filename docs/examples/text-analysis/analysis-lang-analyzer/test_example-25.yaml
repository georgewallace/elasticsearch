--- !metadata
id: example-25
language: elastic_console
topic: analysis-lang-analyzer
subtopic: default
example_order: 25
--- !code
|
  PUT /lithuanian_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "lithuanian_stop": {
            "type":       "stop",
            "stopwords":  "_lithuanian_" 
          },
          "lithuanian_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["pavyzdys"] 
          },
          "lithuanian_stemmer": {
            "type":       "stemmer",
            "language":   "lithuanian"
          }
        },
        "analyzer": {
          "rebuilt_lithuanian": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "lithuanian_stop",
              "lithuanian_keywords",
              "lithuanian_stemmer"
            ]
          }
        }
      }
    }
  }
--- !result

