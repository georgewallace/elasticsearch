--- !code
|
  PUT /indonesian_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "indonesian_stop": {
            "type":       "stop",
            "stopwords":  "_indonesian_" 
          },
          "indonesian_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["contoh"] 
          },
          "indonesian_stemmer": {
            "type":       "stemmer",
            "language":   "indonesian"
          }
        },
        "analyzer": {
          "rebuilt_indonesian": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "indonesian_stop",
              "indonesian_keywords",
              "indonesian_stemmer"
            ]
          }
        }
      }
    }
  }
