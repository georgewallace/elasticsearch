--- !metadata
id: example-3
language: elastic_console
topic: analysis-lang-analyzer
subtopic: default
example_order: 3
--- !code
|
  PUT /basque_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "basque_stop": {
            "type":       "stop",
            "stopwords":  "_basque_" 
          },
          "basque_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["Adibidez"] 
          },
          "basque_stemmer": {
            "type":       "stemmer",
            "language":   "basque"
          }
        },
        "analyzer": {
          "rebuilt_basque": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "basque_stop",
              "basque_keywords",
              "basque_stemmer"
            ]
          }
        }
      }
    }
  }
--- !result

