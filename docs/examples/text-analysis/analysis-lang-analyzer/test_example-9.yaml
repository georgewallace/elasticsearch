--- !code
|
  PUT /czech_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "czech_stop": {
            "type":       "stop",
            "stopwords":  "_czech_" 
          },
          "czech_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["příklad"] 
          },
          "czech_stemmer": {
            "type":       "stemmer",
            "language":   "czech"
          }
        },
        "analyzer": {
          "rebuilt_czech": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "czech_stop",
              "czech_keywords",
              "czech_stemmer"
            ]
          }
        }
      }
    }
  }
