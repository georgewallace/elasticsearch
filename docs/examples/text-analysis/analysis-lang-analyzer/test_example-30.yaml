--- !code
|
  PUT /russian_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "russian_stop": {
            "type":       "stop",
            "stopwords":  "_russian_" 
          },
          "russian_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["пример"] 
          },
          "russian_stemmer": {
            "type":       "stemmer",
            "language":   "russian"
          }
        },
        "analyzer": {
          "rebuilt_russian": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "russian_stop",
              "russian_keywords",
              "russian_stemmer"
            ]
          }
        }
      }
    }
  }
