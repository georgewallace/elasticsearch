--- !metadata
id: example-5
language: elastic_console
topic: analysis-lang-analyzer
subtopic: default
example_order: 5
--- !code
|
  PUT /brazilian_example
  {
    "settings": {
      "analysis": {
        "filter": {
          "brazilian_stop": {
            "type":       "stop",
            "stopwords":  "_brazilian_" 
          },
          "brazilian_keywords": {
            "type":       "keyword_marker",
            "keywords":   ["exemplo"] 
          },
          "brazilian_stemmer": {
            "type":       "stemmer",
            "language":   "brazilian"
          }
        },
        "analyzer": {
          "rebuilt_brazilian": {
            "tokenizer":  "standard",
            "filter": [
              "lowercase",
              "brazilian_stop",
              "brazilian_keywords",
              "brazilian_stemmer"
            ]
          }
        }
      }
    }
  }
--- !result

