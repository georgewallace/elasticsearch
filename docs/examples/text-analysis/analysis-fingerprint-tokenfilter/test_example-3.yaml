--- !code
|
  PUT custom_fingerprint_example
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "whitespace_": {
            "tokenizer": "whitespace",
            "filter": [ "fingerprint_plus_concat" ]
          }
        },
        "filter": {
          "fingerprint_plus_concat": {
            "type": "fingerprint",
            "max_output_size": 100,
            "separator": "+"
          }
        }
      }
    }
  }
--- !result

