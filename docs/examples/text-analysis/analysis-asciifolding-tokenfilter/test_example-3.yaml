      "analysis": {
        "analyzer": {
          "standard_asciifolding": {
            "tokenizer": "standard",
            "filter": [ "my_ascii_folding" ]
          }
        },
        "filter": {
          "my_ascii_folding": {
            "type": "asciifolding",
            "preserve_original": true
          }
        }
      }
    }
  }
