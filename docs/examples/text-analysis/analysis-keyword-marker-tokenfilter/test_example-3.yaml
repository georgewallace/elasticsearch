--- !code
|
  GET /_analyze
  {
    "tokenizer": "whitespace",
    "filter": [
      {
        "type": "keyword_marker",
        "keywords": [ "jumping" ]
      },
      "stemmer"
    ],
    "text": "fox running and jumping",
    "explain": true,
    "attributes": "keyword"
  }
