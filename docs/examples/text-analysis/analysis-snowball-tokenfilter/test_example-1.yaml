  PUT /my-index-000001
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "my_analyzer": {
            "tokenizer": "standard",
            "filter": [ "lowercase", "my_snow" ]
          }
        },
        "filter": {
          "my_snow": {
            "type": "snowball",
            "language": "English"
          }
        }
      }
    }
  }
