--- !metadata
id: example-3
language: elastic_console
topic: analysis-word-delimiter-tokenfilter
subtopic: default
example_order: 3
--- !code
|
  PUT /my-index-000001
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "my_analyzer": {
            "tokenizer": "keyword",
            "filter": [ "my_custom_word_delimiter_filter" ]
          }
        },
        "filter": {
          "my_custom_word_delimiter_filter": {
            "type": "word_delimiter",
            "type_table": [ "- => ALPHA" ],
            "split_on_case_change": false,
            "split_on_numerics": false,
            "stem_english_possessive": true
          }
        }
      }
    }
  }
--- !result

