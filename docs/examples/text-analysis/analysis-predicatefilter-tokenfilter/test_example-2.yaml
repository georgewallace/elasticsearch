--- !code
|
  PUT /my-index-000001
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "my_analyzer": {
            "tokenizer": "standard",
            "filter": [
              "my_script_filter"
            ]
          }
        },
        "filter": {
          "my_script_filter": {
            "type": "predicate_token_filter",
            "script": {
              "source": """
                token.type.contains("ALPHANUM")
              """
            }
          }
        }
      }
    }
  }
--- !result

