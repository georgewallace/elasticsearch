--- !code
|
  PUT my-index-000001
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "my_analyzer": {
            "tokenizer": "keyword",
            "char_filter": [
              "my_custom_html_strip_char_filter"
            ]
          }
        },
        "char_filter": {
          "my_custom_html_strip_char_filter": {
            "type": "html_strip",
            "escaped_tags": [
              "b"
            ]
          }
        }
      }
    }
  }
--- !result

