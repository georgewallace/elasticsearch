--- !code
|
  PUT /my-index-000001
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "en": {
            "tokenizer": "standard",
            "filter": [ "my_shingle_filter" ]
          }
        },
        "filter": {
          "my_shingle_filter": {
            "type": "shingle",
            "min_shingle_size": 2,
            "max_shingle_size": 5,
            "output_unigrams": false
          }
        }
      }
    }
  }
--- !result

