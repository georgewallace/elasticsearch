--- !code
|
  PUT /cjk_bigram_example
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "han_bigrams": {
            "tokenizer": "standard",
            "filter": [ "han_bigrams_filter" ]
          }
        },
        "filter": {
          "han_bigrams_filter": {
            "type": "cjk_bigram",
            "ignored_scripts": [
              "hangul",
              "hiragana",
              "katakana"
            ],
            "output_unigrams": true
          }
        }
      }
    }
  }
--- !result

