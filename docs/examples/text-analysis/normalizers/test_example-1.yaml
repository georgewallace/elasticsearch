# Source: text-analysis/normalizers.md
--- !metadata
id: example-1
language: elastic_console
topic: normalizers
subtopic: default
example_order: 1
--- !code
|
  PUT index
  {
    "settings": {
      "analysis": {
        "char_filter": {
          "quote": {
            "type": "mapping",
            "mappings": [
              "« => \"",
              "» => \""
            ]
          }
        },
        "normalizer": {
          "my_normalizer": {
            "type": "custom",
            "char_filter": ["quote"],
            "filter": ["lowercase", "asciifolding"]
          }
        }
      }
    },
    "mappings": {
      "properties": {
        "foo": {
          "type": "keyword",
          "normalizer": "my_normalizer"
        }
      }
    }
  }
--- !result

