            "type": "custom",
            "tokenizer": "standard",
            "filter": [
              "my_custom_word_delimiter_graph_filter",
              "flatten_graph"
            ]
          }
        },
        "filter": {
          "my_custom_word_delimiter_graph_filter": {
            "type": "word_delimiter_graph",
            "catenate_all": true
          }
        }
      }
    }
  }
