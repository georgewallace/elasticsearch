example_order: 2
--- !code
|
  PUT /my-index-000001
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "en": {
            "tokenizer": "standard",
            "filter": [ "my_en_US_dict_stemmer" ]
          }
        },
        "filter": {
          "my_en_US_dict_stemmer": {
            "type": "hunspell",
            "locale": "en_US",
            "dedup": false
          }
        }
      }
    }
  }
--- !result

