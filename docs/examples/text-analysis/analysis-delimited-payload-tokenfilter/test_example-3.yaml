--- !code
|
  PUT delimited_payload_example
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "whitespace_plus_delimited": {
            "tokenizer": "whitespace",
            "filter": [ "plus_delimited" ]
          }
        },
        "filter": {
          "plus_delimited": {
            "type": "delimited_payload",
            "delimiter": "+",
            "encoding": "int"
          }
        }
      }
    }
  }
