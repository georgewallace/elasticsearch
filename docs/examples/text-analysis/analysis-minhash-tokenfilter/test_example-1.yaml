# Source: text-analysis/analysis-minhash-tokenfilter.md
--- !metadata
id: example-1
language: elastic_console
topic: analysis-minhash-tokenfilter
subtopic: default
example_order: 1
--- !code
|
  PUT /my-index-000001
  {
    "settings": {
      "analysis": {
        "filter": {
          "my_shingle_filter": {      
            "type": "shingle",
            "min_shingle_size": 5,
            "max_shingle_size": 5,
            "output_unigrams": false
          },
          "my_minhash_filter": {
            "type": "min_hash",
            "hash_count": 1,          
            "bucket_count": 512,      
            "hash_set_size": 1,       
            "with_rotation": true     
          }
        },
        "analyzer": {
          "my_analyzer": {
            "tokenizer": "standard",
            "filter": [
              "my_shingle_filter",
              "my_minhash_filter"
            ]
          }
        }
      }
    },
    "mappings": {
      "properties": {
        "fingerprint": {
          "type": "text",
          "analyzer": "my_analyzer"
        }
      }
    }
  }
--- !result

