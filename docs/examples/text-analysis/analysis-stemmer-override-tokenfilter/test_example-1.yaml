--- !code
|
  PUT /my-index-000001
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "my_analyzer": {
            "tokenizer": "standard",
            "filter": [ "lowercase", "custom_stems", "porter_stem" ]
          }
        },
        "filter": {
          "custom_stems": {
            "type": "stemmer_override",
            "rules_path": "analysis/stemmer_override.txt"
          }
        }
      }
    }
  }
--- !result

