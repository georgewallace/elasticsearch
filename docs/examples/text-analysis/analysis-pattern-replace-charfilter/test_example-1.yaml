--- !metadata
id: example-1
language: elastic_console
topic: analysis-pattern-replace-charfilter
subtopic: default
example_order: 1
--- !code
|
  PUT my-index-000001
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "my_analyzer": {
            "tokenizer": "standard",
            "char_filter": [
              "my_char_filter"
            ]
          }
        },
        "char_filter": {
          "my_char_filter": {
            "type": "pattern_replace",
            "pattern": "(\\d+)-(?=\\d)",
            "replacement": "$1_"
          }
        }
      }
    }
  }

  POST my-index-000001/_analyze
  {
    "analyzer": "my_analyzer",
    "text": "My credit card is 123-456-789"
  }
