--- !code
|
  PUT /common_grams_example
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "index_grams": {
            "tokenizer": "whitespace",
            "filter": [ "common_grams_query" ]
          }
        },
        "filter": {
          "common_grams_query": {
            "type": "common_grams",
            "common_words": [ "a", "is", "the" ],
            "ignore_case": true,
            "query_mode": true
          }
        }
      }
    }
  }
