--- !metadata
id: example-4
language: elastic_console
topic: analysis-stop-tokenfilter
subtopic: default
example_order: 4
--- !code
|
  PUT /my-index-000001
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "default": {
            "tokenizer": "whitespace",
            "filter": [ "my_custom_stop_words_filter" ]
          }
        },
        "filter": {
          "my_custom_stop_words_filter": {
            "type": "stop",
            "ignore_case": true,
            "stopwords": [ "and", "is", "the" ]
          }
        }
      }
    }
  }
--- !result

