--- !code
|
  PUT my-index-000001
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "my_analyzer": {
            "tokenizer": "my_tokenizer"
          }
        },
        "tokenizer": {
          "my_tokenizer": {
            "type": "path_hierarchy",
            "delimiter": "-",
            "replacement": "/",
            "skip": 2
          }
        }
      }
    }
  }

  POST my-index-000001/_analyze
  {
    "analyzer": "my_analyzer",
    "text": "one-two-three-four-five"
  }
