--- !code
|
  GET /_analyze
  {
    "tokenizer": "standard",
    "filter": [
      {
        "type": "condition",
        "filter": [ "lowercase" ],
        "script": {
          "source": "token.getTerm().length() < 5"
        }
      }
    ],
    "text": "THE QUICK BROWN FOX"
  }
