--- !code
|
  PUT /palindrome_list
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "whitespace_reverse_first_token": {
            "tokenizer": "whitespace",
            "filter": [ "reverse_first_token" ]
          }
        },
        "filter": {
          "reverse_first_token": {
            "type": "condition",
            "filter": [ "reverse" ],
            "script": {
              "source": "token.getPosition() === 0"
            }
          }
        }
      }
    }
  }
--- !result

