      "analysis": {
        "analyzer": {
          "my_email_analyzer": {
            "type":      "pattern",
            "pattern":   "\\W|_", 
            "lowercase": true
          }
        }
      }
    }
  }

  POST my-index-000001/_analyze
  {
    "analyzer": "my_email_analyzer",
    "text": "John_Smith@foo-bar.com"
  }
