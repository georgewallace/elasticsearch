  PUT my-index-000001
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "camel": {
            "type": "pattern",
            "pattern": "([^\\p{L}\\d]+)|(?<=\\D)(?=\\d)|(?<=\\d)(?=\\D)|(?<=[\\p{L}&&[^\\p{Lu}]])(?=\\p{Lu})|(?<=\\p{Lu})(?=\\p{Lu}[\\p{L}&&[^\\p{Lu}]])"
          }
        }
      }
    }
  }

  GET my-index-000001/_analyze
  {
    "analyzer": "camel",
    "text": "MooseX::FTPClass2_beta"
  }
