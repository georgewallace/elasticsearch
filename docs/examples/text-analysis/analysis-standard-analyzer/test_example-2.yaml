  PUT my-index-000001
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "my_english_analyzer": {
            "type": "standard",
            "max_token_length": 5,
            "stopwords": "_english_"
          }
        }
      }
    }
  }

  POST my-index-000001/_analyze
  {
    "analyzer": "my_english_analyzer",
    "text": "The 2 QUICK Brown-Foxes jumped over the lazy dog's bone."
  }
