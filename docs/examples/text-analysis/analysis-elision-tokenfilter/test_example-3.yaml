--- !code
|
  PUT /elision_case_insensitive_example
  {
    "settings": {
      "analysis": {
        "analyzer": {
          "default": {
            "tokenizer": "whitespace",
            "filter": [ "elision_case_insensitive" ]
          }
        },
        "filter": {
          "elision_case_insensitive": {
            "type": "elision",
            "articles": [ "l", "m", "t", "qu", "n", "s", "j" ],
            "articles_case": true
          }
        }
      }
    }
  }
