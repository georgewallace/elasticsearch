--- !metadata
id: example-1
language: elastic_console
topic: set-processor
subtopic: default
example_order: 1
--- !code
|
  PUT _ingest/pipeline/set_os
  {
    "description": "sets the value of host.os.name from the field os",
    "processors": [
      {
        "set": {
          "field": "host.os.name",
          "value": "{{{os}}}"
        }
      }
    ]
  }

  POST _ingest/pipeline/set_os/_simulate
  {
    "docs": [
      {
        "_source": {
          "os": "Ubuntu"
        }
      }
    ]
  }
--- !result
|
  {
    "docs" : [
      {
        "doc" : {
          "_index" : "_index",
          "_id" : "_id",
          "_version" : "-3",
          "_source" : {
            "host" : {
              "os" : {
                "name" : "Ubuntu"
              }
            },
            "os" : "Ubuntu"
          },
          "_ingest" : {
            "timestamp" : "2016-11-08T19:43:03.850+0000"
          }
        }
      }
    ]
  }
