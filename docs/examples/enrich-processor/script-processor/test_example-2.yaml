--- !code
|
  POST _ingest/pipeline/_simulate
  {
    "pipeline": {
      "processors": [
        {
          "script": {
            "description": "Set index based on `lang` field and `dataset` param",
            "lang": "painless",
            "source": """
              ctx['_index'] = ctx['lang'] + '-' + params['dataset'];
            """,
            "params": {
              "dataset": "catalog"
            }
          }
        }
      ]
    },
    "docs": [
      {
        "_index": "generic-index",
        "_source": {
          "lang": "fr"
        }
      }
    ]
  }
--- !result
|
  {
    "docs": [
      {
        "doc": {
          ...
          "_index": "fr-catalog",
          "_source": {
            "lang": "fr"
          }
        }
      }
    ]
  }
