  PUT _ingest/pipeline/polygonize_circles
  {
    "description": "translate circle to polygon",
    "processors": [
      {
        "circle": {
          "field": "circle",
          "error_distance": 28.0,
          "shape_type": "geo_shape"
        }
      }
    ]
  }
