--- !code
|
  POST _ingest/pipeline/_simulate
  {
    "pipeline": {
      "description" : "Hide my IP",
      "processors": [
        {
          "redact": {
            "field": "message",
            "patterns": ["%{IP:client}"]
          }
        }
      ]
    },
    "docs":[
      {
        "_source": {
          "message": "55.3.244.1 GET /index.html 15824 0.043"
        }
      }
    ]
  }
--- !result
|
  {
    "docs": [
      {
        "doc": {
          "_index": "_index",
          "_id": "_id",
          "_version": "-3",
          "_source": {
            "message": "<client> GET /index.html 15824 0.043"
          },
          "_ingest": {
            "timestamp": "2023-02-01T16:08:39.419056008Z"
          }
        }
      }
    ]
  }
