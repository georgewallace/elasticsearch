--- !metadata
id: example-2
language: elastic_console
topic: geoip-processor
subtopic: default
example_order: 2
--- !code
|
  PUT _ingest/pipeline/geoip
  {
    "description" : "Add ip geolocation info",
    "processors" : [
      {
        "geoip" : {
          "field" : "ip",
          "target_field" : "geo",
          "database_file" : "GeoLite2-Country.mmdb"
        }
      }
    ]
  }
  PUT my-index-000001/_doc/my_id?pipeline=geoip
  {
    "ip": "89.160.20.128"
  }
  GET my-index-000001/_doc/my_id
--- !result
|
  {
    "found": true,
    "_index": "my-index-000001",
    "_id": "my_id",
    "_version": 1,
    "_seq_no": 65,
    "_primary_term": 1,
    "_source": {
      "ip": "89.160.20.128",
      "geo": {
        "continent_name": "Europe",
        "country_name": "Sweden",
        "country_iso_code": "SE"
      }
    }
  }
