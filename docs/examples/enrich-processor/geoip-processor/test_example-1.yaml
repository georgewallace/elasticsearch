--- !metadata
id: example-1
language: elastic_console
topic: geoip-processor
subtopic: default
example_order: 1
--- !code
|
  PUT _ingest/pipeline/geoip
  {
    "description" : "Add ip geolocation info",
    "processors" : [
      {
        "geoip" : {
          "field" : "ip"
        }
      }
    ]
  }
  PUT my-index-000001/_doc/my_id?pipeline=geoip
  {
    "ip": "89.160.20.128"
  }
  GET my-index-000001/_doc/my_id
--- !result
|
  {
    "found": true,
    "_index": "my-index-000001",
    "_id": "my_id",
    "_version": 1,
    "_seq_no": 55,
    "_primary_term": 1,
    "_source": {
      "ip": "89.160.20.128",
      "geoip": {
        "continent_name": "Europe",
        "country_name": "Sweden",
        "country_iso_code": "SE",
        "city_name" : "Linköping",
        "region_iso_code" : "SE-E",
        "region_name" : "Östergötland County",
        "location": { "lat": 58.4167, "lon": 15.6167 }
      }
    }
  }
