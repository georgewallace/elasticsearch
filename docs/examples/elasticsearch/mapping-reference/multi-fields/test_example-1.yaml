# Source: elasticsearch/mapping-reference/multi-fields.md
--- !metadata
id: example-1
language: elastic_console
topic: multi-fields
subtopic: default
example_order: 1
--- !code
|
  PUT my-index-000001
  {
    "mappings": {
      "properties": {
        "city": {
          "type": "text",
          "fields": {
            "raw": { 
              "type":  "keyword"
            }
          }
        }
      }
    }
  }

  PUT my-index-000001/_doc/1
  {
    "city": "New York"
  }

  PUT my-index-000001/_doc/2
  {
    "city": "York"
  }

  GET my-index-000001/_search
  {
    "query": {
      "match": {
        "city": "york" 
      }
    },
    "sort": {
      "city.raw": "asc" 
    },
    "aggs": {
      "Cities": {
        "terms": {
          "field": "city.raw" 
        }
      }
    }
  }
--- !result

--- !test
steps:
  - action:
      kind: EXAMPLE_CODE
  - expected:
      kind: EXAMPLE_RESULT
      status_codes: [200, 201]
      match_fields:
        - field: '*'
          match_kind: EQUALS
      ignore_fields:
        - took
