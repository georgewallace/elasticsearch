# Source: elasticsearch/mapping-reference/multi-fields.md
--- !metadata
id: example-2
language: elastic_console
topic: multi-fields
subtopic: default
example_order: 2
--- !code
|
  PUT my-index-000001
  {
    "mappings": {
      "properties": {
        "text": { 
          "type": "text",
          "fields": {
            "english": { 
              "type":     "text",
              "analyzer": "english"
            }
          }
        }
      }
    }
  }

  PUT my-index-000001/_doc/1
  { "text": "quick brown fox" } 

  PUT my-index-000001/_doc/2
  { "text": "quick brown foxes" } 

  GET my-index-000001/_search
  {
    "query": {
      "multi_match": {
        "query": "quick brown foxes",
        "fields": [ 
          "text",
          "text.english"
        ],
        "type": "most_fields" 
      }
    }
  }
--- !result

--- !test
