--- !code
|
  PUT idx
  {
    "settings": {
      "index": {
        "mapping": {
          "source": {
            "mode": "synthetic"
          }
        }
      }
    },
    "mappings": {
      "properties": {
        "agg_metric": {
          "type": "aggregate_metric_double",
          "metrics": [ "min", "max", "sum", "value_count" ],
          "default_metric": "max"
        }
      }
    }
  }

  PUT idx/_doc/1
  {
    "agg_metric": {
      "min": -302.50,
      "max": 702.30,
      "sum": 200.0,
      "value_count": 25
    }
  }
  GET idx/_doc/1
