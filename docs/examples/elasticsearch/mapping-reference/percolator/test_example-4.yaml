--- !code
|
  PUT new_index
  {
    "mappings": {
      "properties": {
        "query" : {
          "type" : "percolator"
        },
        "body" : {
          "type": "text"
        }
      }
    }
  }

  POST /_reindex?refresh
  {
    "source": {
      "index": "index"
    },
    "dest": {
      "index": "new_index"
    }
  }

  POST _aliases
  {
    "actions": [ 
      {
        "remove": {
          "index" : "index",
          "alias": "queries"
        }
      },
      {
        "add": {
          "index": "new_index",
          "alias": "queries"
        }
      }
    ]
  }
