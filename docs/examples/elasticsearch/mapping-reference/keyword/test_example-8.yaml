--- !metadata
id: example-8
language: elastic_console
topic: keyword
subtopic: default
example_order: 8
--- !code
|
  PUT my-index-000001
  {
    "mappings": {
      "properties": {
        "my_wildcard": {
          "type": "wildcard"
        }
      }
    }
  }

  PUT my-index-000001/_doc/1
  {
    "my_wildcard" : "This string can be quite lengthy"
  }

  GET my-index-000001/_search
  {
    "query": {
      "wildcard": {
        "my_wildcard": {
          "value": "*quite*lengthy"
        }
      }
    }
  }
--- !result

