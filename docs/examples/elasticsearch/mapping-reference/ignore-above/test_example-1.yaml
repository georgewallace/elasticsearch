# Source: elasticsearch/mapping-reference/ignore-above.md
--- !metadata
id: example-1
language: elastic_console
topic: ignore-above
subtopic: default
example_order: 1
--- !code
|
  PUT my-index-000001
  {
    "mappings": {
      "properties": {
        "message": {
          "type": "keyword",
          "ignore_above": 20 
        }
      }
    }
  }

  PUT my-index-000001/_doc/1 
  {
    "message": "Syntax error"
  }

  PUT my-index-000001/_doc/2 
  {
    "message": "Syntax error with some long stacktrace"
  }

  GET my-index-000001/_search 
  {
    "aggs": {
      "messages": {
        "terms": {
          "field": "message"
        }
      }
    }
  }
--- !result

