# Source: elasticsearch/mapping-reference/dense-vector.md
--- !metadata
id: example-1
language: elastic_console
topic: dense-vector
subtopic: default
example_order: 1
--- !code
|
  PUT my-index
  {
    "mappings": {
      "properties": {
        "my_vector": {
          "type": "dense_vector",
          "dims": 3
        },
        "my_text" : {
          "type" : "keyword"
        }
      }
    }
  }

  PUT my-index/_doc/1
  {
    "my_text" : "text1",
    "my_vector" : [0.5, 10, 6]
  }

  PUT my-index/_doc/2
  {
    "my_text" : "text2",
    "my_vector" : [-0.5, 10, 10]
  }
--- !result

