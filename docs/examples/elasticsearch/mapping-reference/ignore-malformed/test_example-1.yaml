--- !metadata
id: example-1
language: elastic_console
topic: ignore-malformed
subtopic: default
example_order: 1
--- !code
|
  PUT my-index-000001
  {
    "mappings": {
      "properties": {
        "number_one": {
          "type": "integer",
          "ignore_malformed": true
        },
        "number_two": {
          "type": "integer"
        }
      }
    }
  }

  PUT my-index-000001/_doc/1
  {
    "text":       "Some text value",
    "number_one": "foo" 
  }

  PUT my-index-000001/_doc/2
  {
    "text":       "Some text value",
    "number_two": "foo" 
  }
--- !result

