--- !code
|
  PUT my-index-000001
  {
    "mappings": {
      "properties": {
        "name": { 
          "type": "text",
          "fields": {
            "length": { 
              "type":     "token_count",
              "analyzer": "standard"
            }
          }
        }
      }
    }
  }

  PUT my-index-000001/_doc/1
  { "name": "John Smith" }

  PUT my-index-000001/_doc/2
  { "name": "Rachel Alice Williams" }

  GET my-index-000001/_search
  {
    "query": {
      "term": {
        "name.length": 3 
      }
    }
  }
--- !result

