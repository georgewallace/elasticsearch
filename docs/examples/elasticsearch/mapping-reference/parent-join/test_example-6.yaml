--- !metadata
id: example-6
language: elastic_console
topic: parent-join
subtopic: default
example_order: 6
--- !code
|
  GET my-index-000001/_search
  {
    "query": {
      "parent_id": { 
        "type": "answer",
        "id": "1"
      }
    },
    "aggs": {
      "parents": {
        "terms": {
          "field": "my_join_field#question", 
          "size": 10
        }
      }
    },
    "runtime_mappings": {
      "parent": {
        "type": "long",
        "script": """
          emit(Integer.parseInt(doc['my_join_field#question'].value)) 
        """
      }
    },
    "fields": [
      { "field": "parent" }
    ]
  }
--- !result

