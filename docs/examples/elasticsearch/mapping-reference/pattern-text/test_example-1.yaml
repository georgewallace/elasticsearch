|
  PUT logs
  {
    "settings": {
      "index": {
        "sort.field": [ "notice.template_id", "@timestamp" ],
        "sort.order": [ "asc", "desc" ]
      }
    },
    "mappings": {
      "properties": {
        "@timestamp": {
          "type": "date"
        },
        "notice": {
          "type": "pattern_text"
        }
      }
    }
  }
