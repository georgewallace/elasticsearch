--- !code
|
  GET my-index-000001/_search
  {
    "query": {
      "match": {
        "manager.name": "Alice White"
      }
    },
    "aggs": {
      "Employees": {
        "nested": {
          "path": "employees"
        },
        "aggs": {
          "Employee Ages": {
            "histogram": {
              "field": "employees.age",
              "interval": 5
            }
          }
        }
      }
    }
  }
