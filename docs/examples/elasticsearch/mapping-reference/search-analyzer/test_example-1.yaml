# Source: elasticsearch/mapping-reference/search-analyzer.md
--- !metadata
id: example-1
language: elastic_console
topic: search-analyzer
subtopic: default
example_order: 1
--- !code
|
  PUT my-index-000001
  {
    "settings": {
      "analysis": {
        "filter": {
          "autocomplete_filter": {
            "type": "edge_ngram",
            "min_gram": 1,
            "max_gram": 20
          }
        },
        "analyzer": {
          "autocomplete": { 
            "type": "custom",
            "tokenizer": "standard",
            "filter": [
              "lowercase",
              "autocomplete_filter"
            ]
          }
        }
      }
    },
    "mappings": {
      "properties": {
        "text": {
          "type": "text",
          "analyzer": "autocomplete", 
          "search_analyzer": "standard" 
        }
      }
    }
  }

  PUT my-index-000001/_doc/1
  {
    "text": "Quick Brown Fox" 
  }

  GET my-index-000001/_search
  {
    "query": {
      "match": {
        "text": {
          "query": "Quick Br", 
          "operator": "and"
        }
      }
    }
  }
--- !result

