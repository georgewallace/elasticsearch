--- !metadata
id: example-1
language: elastic_console
topic: mapping-index-field
subtopic: default
example_order: 1
--- !code
|
  PUT index_1/_doc/1
  {
    "text": "Document in index 1"
  }

  PUT index_2/_doc/2?refresh=true
  {
    "text": "Document in index 2"
  }

  GET index_1,index_2/_search
  {
    "query": {
      "terms": {
        "_index": ["index_1", "index_2"] 
      }
    },
    "aggs": {
      "indices": {
        "terms": {
          "field": "_index", 
          "size": 10
        }
      }
    },
    "sort": [
      {
        "_index": { 
          "order": "asc"
        }
      }
    ],
    "script_fields": {
      "index_name": {
        "script": {
          "lang": "painless",
          "source": "doc['_index']" 
        }
      }
    }
  }
--- !result

