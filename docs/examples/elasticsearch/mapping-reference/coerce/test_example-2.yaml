  PUT my-index-000001
  {
    "settings": {
      "index.mapping.coerce": false
    },
    "mappings": {
      "properties": {
        "number_one": {
          "type": "integer",
          "coerce": true
        },
        "number_two": {
          "type": "integer"
        }
      }
    }
  }

  PUT my-index-000001/_doc/1
  { "number_one": "10" } 

  PUT my-index-000001/_doc/2
  { "number_two": "10" }
