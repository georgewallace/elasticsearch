# Source: elasticsearch/mapping-reference/analyzer.md
--- !metadata
id: example-1
language: elastic_console
topic: analyzer
subtopic: _default
example_order: 1
--- !code
|
  PUT my-index-000001
  {
     "settings":{
        "analysis":{
           "analyzer":{
              "my_analyzer":{ 
                 "type":"custom",
                 "tokenizer":"standard",
                 "filter":[
                    "lowercase"
                 ]
              },
              "my_stop_analyzer":{ 
                 "type":"custom",
                 "tokenizer":"standard",
                 "filter":[
                    "lowercase",
                    "english_stop"
                 ]
              }
           },
           "filter":{
              "english_stop":{
                 "type":"stop",
                 "stopwords":"_english_"
              }
           }
        }
     },
     "mappings":{
         "properties":{
            "title": {
               "type":"text",
               "analyzer":"my_analyzer", 
               "search_analyzer":"my_stop_analyzer", 
               "search_quote_analyzer":"my_analyzer" 
           }
        }
     }
  }

  PUT my-index-000001/_doc/1
  {
     "title":"The Quick Brown Fox"
  }

  PUT my-index-000001/_doc/2
  {
     "title":"A Quick Brown Fox"
  }

  GET my-index-000001/_search
  {
     "query":{
        "query_string":{
           "query":"\"the quick brown fox\"" 
        }
     }
  }
--- !result

--- !test
