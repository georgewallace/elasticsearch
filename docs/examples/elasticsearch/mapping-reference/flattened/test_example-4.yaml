--- !code
|
  PUT my-index-000001
  {
    "mappings": {
      "properties": {
        "flattened_field": {
          "type": "flattened"
        }
      }
    }
  }

  PUT my-index-000001/_doc/1?refresh=true
  {
    "flattened_field" : {
      "subfield" : "value"
    }
  }

  POST my-index-000001/_search
  {
    "fields": ["flattened_field.subfield"],
    "_source": false
  }
