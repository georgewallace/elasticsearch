# Source: elasticsearch/mapping-reference/boolean.md
--- !metadata
id: example-2
language: elastic_console
topic: boolean
subtopic: default
example_order: 2
--- !code
|
  POST my-index-000001/_doc/1?refresh
  {
    "is_published": true
  }

  POST my-index-000001/_doc/2?refresh
  {
    "is_published": false
  }

  GET my-index-000001/_search
  {
    "aggs": {
      "publish_state": {
        "terms": {
          "field": "is_published"
        }
      }
    },
    "sort": [ "is_published" ],
    "fields": [
      {"field": "weight"}
    ],
    "runtime_mappings": {
      "weight": {
        "type": "long",
        "script": "emit(doc['is_published'].value ? 10 : 0)"
      }
    }
  }
--- !result

