--- !metadata
id: example-1
language: elastic_console
topic: normalizer
subtopic: default
example_order: 1
--- !code
|
  PUT index
  {
    "settings": {
      "analysis": {
        "normalizer": {
          "my_normalizer": {
            "type": "custom",
            "char_filter": [],
            "filter": ["lowercase", "asciifolding"]
          }
        }
      }
    },
    "mappings": {
      "properties": {
        "foo": {
          "type": "keyword",
          "normalizer": "my_normalizer"
        }
      }
    }
  }

  PUT index/_doc/1
  {
    "foo": "BÀR"
  }

  PUT index/_doc/2
  {
    "foo": "bar"
  }

  PUT index/_doc/3
  {
    "foo": "baz"
  }

  POST index/_refresh

  GET index/_search
  {
    "query": {
      "term": {
        "foo": "BAR"
      }
    }
  }

  GET index/_search
  {
    "query": {
      "match": {
        "foo": "BAR"
      }
    }
  }
