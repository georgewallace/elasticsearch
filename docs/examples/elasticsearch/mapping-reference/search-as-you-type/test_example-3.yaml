--- !code
|
  GET my-index-000001/_search
  {
    "query": {
      "multi_match": {
        "query": "brown f",
        "type": "bool_prefix",
        "fields": [
          "my_field",
          "my_field._2gram",
          "my_field._3gram"
        ]
      }
    },
    "highlight": {
      "fields": {
        "my_field": {
          "matched_fields": ["my_field._index_prefix"] 
        }
      }
    }
  }
