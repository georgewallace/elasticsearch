--- !code
|
  PUT my-index-000001
  {
    "mappings": {
      "properties": {
        "title": {
          "type": "text",
          "store": true 
        },
        "date": {
          "type": "date",
          "store": true 
        },
        "content": {
          "type": "text"
        }
      }
    }
  }

  PUT my-index-000001/_doc/1
  {
    "title":   "Some short title",
    "date":    "2015-01-01",
    "content": "A very long content field..."
  }

  GET my-index-000001/_search
  {
    "stored_fields": [ "title", "date" ] 
  }
