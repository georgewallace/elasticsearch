  PUT idx
  {
    "settings": {
      "index": {
        "mapping": {
          "source": {
            "mode": "synthetic"
          }
        }
      }
    },
    "mappings": {
      "properties": {
        "my_range": { "type": "long_range" }
      }
    }
  }

  PUT idx/_doc/1
  {
    "my_range": [
      {
          "gte": 200,
          "lte": 300
      },
      {
          "gte": 1,
          "lte": 100
      },
      {
          "gte": 200,
          "lte": 300
      },
      {
          "gte": 200,
          "lte": 500
      }
    ]
  }
  GET idx/_doc/1
