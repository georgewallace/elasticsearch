# Source: elasticsearch/mapping-reference/nested.md
--- !metadata
id: example-3
language: elastic_console
topic: nested
subtopic: default
example_order: 3
--- !code
|
  PUT my-index-000001
  {
    "mappings": {
      "properties": {
        "user": {
          "type": "nested" 
        }
      }
    }
  }

  PUT my-index-000001/_doc/1
  {
    "group" : "fans",
    "user" : [
      {
        "first" : "John",
        "last" :  "Smith"
      },
      {
        "first" : "Alice",
        "last" :  "White"
      }
    ]
  }

  GET my-index-000001/_search
  {
    "query": {
      "nested": {
        "path": "user",
        "query": {
          "bool": {
            "must": [
              { "match": { "user.first": "Alice" }},
              { "match": { "user.last":  "Smith" }} 
            ]
          }
        }
      }
    }
  }

  GET my-index-000001/_search
  {
    "query": {
      "nested": {
        "path": "user",
        "query": {
          "bool": {
            "must": [
              { "match": { "user.first": "Alice" }},
              { "match": { "user.last":  "White" }} 
            ]
          }
        },
        "inner_hits": { 
          "highlight": {
            "fields": {
              "user.first": {}
            }
          }
        }
      }
    }
  }
--- !result

