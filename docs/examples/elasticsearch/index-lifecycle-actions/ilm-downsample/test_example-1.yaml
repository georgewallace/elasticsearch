--- !code
|
  PUT _ilm/policy/datastream_policy
  {
    "policy": {
      "phases": {
        "hot": {
          "actions": {
            "rollover": {
              "max_docs": 1
            },
            "downsample": {
    	          "fixed_interval": "1h",
    	          "force_merge_index": false
    	      }
          }
        }
      }
    }
  }
