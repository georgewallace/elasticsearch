--- !code
|
  PUT _ilm/policy/my_policy
  {
    "policy": {
      "phases": {
        "hot": {
          "actions": {
            "rollover" : {
              "max_primary_shard_size": "50gb"
            },
            "searchable_snapshot" : {
              "snapshot_repository" : "backing_repo",
              "replicate_for": "14d"
            }
          }
        },
        "delete": {
          "min_age": "28d",
          "actions": {
            "delete" : { }
          }
        }
      }
    }
  }
