--- !code
|
  POST test/_search
  {
    "suggest": {
      "text" : "noble prize",
      "simple_phrase" : {
        "phrase" : {
          "field" :  "title.trigram",
          "size" :   1,
          "direct_generator" : [ {
            "field" :            "title.trigram",
            "suggest_mode" :     "always",
            "min_word_length" :  1
          } ],
          "collate": {
            "query": { 
              "source" : {
                "match": {
                  "{{field_name}}" : "{{suggestion}}" 
                }
              }
            },
            "params": {"field_name" : "title"}, 
            "prune": true 
          }
        }
      }
    }
  }
