--- !code
|
  PUT test
  {
    "settings": {
      "index": {
        "number_of_shards": 1,
        "analysis": {
          "analyzer": {
            "trigram": {
              "type": "custom",
              "tokenizer": "standard",
              "filter": ["lowercase","shingle"]
            },
            "reverse": {
              "type": "custom",
              "tokenizer": "standard",
              "filter": ["lowercase","reverse"]
            }
          },
          "filter": {
            "shingle": {
              "type": "shingle",
              "min_shingle_size": 2,
              "max_shingle_size": 3
            }
          }
        }
      }
    },
    "mappings": {
      "properties": {
        "title": {
          "type": "text",
          "fields": {
            "trigram": {
              "type": "text",
              "analyzer": "trigram"
            },
            "reverse": {
              "type": "text",
              "analyzer": "reverse"
            }
          }
        }
      }
    }
  }
  POST test/_doc?refresh=true
  {"title": "noble warriors"}
  POST test/_doc?refresh=true
  {"title": "nobel prize"}
