|
  GET retrievers_example/_search
  {
      "retriever": {
          "text_similarity_reranker": {
              "retriever": {
                  "rrf": {
                      "retrievers": [
                          {
                              "standard": {
                                  "query": {
                                      "query_string": {
                                          "query": "(information retrieval) OR (artificial intelligence)",
                                          "default_field": "text"
                                      }
                                  }
                              }
                          },
                          {
                              "knn": {
                                  "field": "vector",
                                  "query_vector": [
                                      0.23,
                                      0.67,
                                      0.89
                                  ],
                                  "k": 3,
                                  "num_candidates": 5
                              }
                          }
                      ],
                      "rank_window_size": 10,
                      "rank_constant": 1
                  }
              },
              "field": "text",
              "inference_id": "my-rerank-model",
              "inference_text": "What are the state of the art applications of AI in information retrieval?",
              "chunk_rescorer": {
                  "size": 1,
                  "chunking_settings": {
                      "strategy": "sentence",
                      "max_chunk_size": 300,
                      "sentence_overlap": 0
                  }
              }
          }
      },
      "_source": false
  }
