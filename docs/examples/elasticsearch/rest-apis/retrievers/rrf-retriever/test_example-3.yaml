--- !code
|
  GET movies/_search
  {
    "retriever": {
      "rrf": {
        "retrievers": [
          {
            "standard": {
              "query": {
                "sparse_vector": {
                  "field": "plot_embedding",
                  "inference_id": "my-elser-model",
                  "query": "films that explore psychological depths"
                }
              }
            }
          },
          {
            "standard": {
              "query": {
                "multi_match": {
                  "query": "crime",
                  "fields": [
                    "plot",
                    "title"
                  ]
                }
              }
            }
          },
          {
            "knn": {
              "field": "vector",
              "query_vector": [10, 22, 77],
              "k": 10,
              "num_candidates": 10
            }
          }
        ]
      }
    }
  }
