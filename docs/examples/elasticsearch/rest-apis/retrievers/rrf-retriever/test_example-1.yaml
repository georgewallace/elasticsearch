--- !metadata
id: example-1
language: elastic_console
topic: rrf-retriever
subtopic: default
example_order: 1
--- !code
|
  GET /restaurants/_search
  {
    "retriever": {
      "rrf": { 
        "retrievers": [ 
          {
            "standard": { 
              "query": {
                "multi_match": {
                  "query": "Austria",
                  "fields": [
                    "city",
                    "region"
                  ]
                }
              }
            }
          },
          {
            "knn": { 
              "field": "vector",
              "query_vector": [10, 22, 77],
              "k": 10,
              "num_candidates": 10
            }
          }
        ],
        "rank_constant": 1, 
        "rank_window_size": 50  
      }
    }
  }
--- !result

