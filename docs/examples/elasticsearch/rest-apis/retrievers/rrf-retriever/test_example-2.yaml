--- !metadata
id: example-2
language: elastic_console
topic: rrf-retriever
subtopic: default
example_order: 2
--- !code
|
  GET /restaurants/_search
  {
    "retriever": {
      "rrf": {
        "retrievers": [
          {
            "retriever": { 
              "standard": {
                "query": {
                  "multi_match": {
                    "query": "Austria",
                    "fields": ["city", "region"]
                  }
                }
              }
            },
            "weight": 2.0 
          },
          {
            "retriever": { 
              "knn": {
                "field": "vector",
                "query_vector": [10, 22, 77],
                "k": 10,
                "num_candidates": 10
              }
            },
            "weight": 1.0 
          }
        ],
        "rank_constant": 60,
        "rank_window_size": 50
      }
    }
  }
--- !result

