      "standard": { 
        "query": { 
          "bool": { 
            "should": [ 
              {
                "match": { 
                  "region": "Austria"
                }
              }
            ],
            "filter": [ 
              {
                "term": { 
                  "year": "2019" 
                }
              }
            ]
          }
        }
      }
    }
  }
