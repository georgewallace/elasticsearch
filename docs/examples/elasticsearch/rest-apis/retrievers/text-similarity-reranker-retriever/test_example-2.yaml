--- !code
|
  POST _search
  {
    "retriever": {
      "text_similarity_reranker": {
        "retriever": {
          "standard": {
            "query": {
              "match": {
                "text": "How often does the moon hide the sun?"
              }
            }
          }
        },
        "field": "text",
        "inference_id": "my-elastic-rerank",
        "inference_text": "How often does the moon hide the sun?",
        "rank_window_size": 100,
        "min_score": 0.5
      }
    }
  }
