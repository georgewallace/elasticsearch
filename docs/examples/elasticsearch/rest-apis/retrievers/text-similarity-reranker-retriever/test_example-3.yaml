--- !code
|
  GET /index/_search
  {
     "retriever": {
        "text_similarity_reranker": {
           "retriever": {
              "standard": {
                 "query": {
                    "match_phrase": {
                       "text": "landmark in Paris"
                    }
                 }
              }
           },
           "field": "text",
           "inference_id": "my-cohere-rerank-model",
           "inference_text": "Most famous landmark in Paris",
           "rank_window_size": 100,
           "min_score": 0.5
        }
     }
  }
