--- !code
|
  POST /_security/_query/api_key
  {
    "size": 0,
    "query": {
      "bool": {
        "filter": {
          "term": {
            "invalidated": true
          }
        }
      }
    },
    "aggs": {
      "invalidated_keys": {
        "composite": {
          "sources": [
            { "username": { "terms": { "field": "username" } } },
            { "key_name": { "terms": { "field": "name" } } }
          ]
        }
      }
    }
  }
