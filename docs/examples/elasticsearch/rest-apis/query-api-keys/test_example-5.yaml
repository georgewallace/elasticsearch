--- !metadata
id: example-5
language: elastic_console
topic: query-api-keys
subtopic: default
example_order: 5
--- !code
|
  POST /_security/_query/api_key
  {
    "size": 0,
    "query": {
      "bool": {
        "must": {
          "term": {
            "invalidated": false  
          }
        },
        "should": [  
          {
            "range": { "expiration": { "gte": "now" } }
          },
          {
            "bool": { "must_not": { "exists": { "field": "expiration" } } }
          }
        ],
        "minimum_should_match": 1
      }
    },
    "aggs": {
      "keys_by_username": {
        "composite": {
          "sources": [ { "usernames": { "terms": { "field": "username" } } } ]  
        },
        "aggs": {
          "expires_soon": {
            "filter": {
              "range": { "expiration": { "lte": "now+30d/d" } }  
            },
            "aggs": {
              "key_names": { "terms": { "field": "name" } }
            }
          }
        }
      }
    }
  }
