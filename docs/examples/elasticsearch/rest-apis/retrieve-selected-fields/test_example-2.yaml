--- !metadata
id: example-2
language: elastic_console
topic: retrieve-selected-fields
subtopic: default
example_order: 2
--- !code
|
  PUT my-index-000001
  {
    "mappings": {
      "properties": {
        "group" : { "type" : "keyword" },
        "user": {
          "type": "nested",
          "properties": {
            "first" : { "type" : "keyword" },
            "last" : { "type" : "keyword" }
          }
        }
      }
    }
  }

  PUT my-index-000001/_doc/1?refresh=true
  {
    "group" : "fans",
    "user" : [
      {
        "first" : "John",
        "last" :  "Smith"
      },
      {
        "first" : "Alice",
        "last" :  "White"
      }
    ]
  }

  POST my-index-000001/_search
  {
    "fields": ["*"],
    "_source": false
  }
