# Source: elasticsearch/rest-apis/retrieve-selected-fields.md
--- !metadata
id: example-4
language: elastic_console
topic: retrieve-selected-fields
subtopic: default
example_order: 4
--- !code
|
  PUT my-index-000001
  {
    "mappings": {
      "enabled": false 
    }
  }

  PUT my-index-000001/_doc/1?refresh=true
  {
    "user_id": "kimchy",
    "session_data": {
       "object": {
         "some_field": "some_value"
       }
     }
  }

  POST my-index-000001/_search
  {
    "fields": [
      "user_id",
      {
        "field": "session_data.object.*",
        "include_unmapped" : true 
      }
    ],
    "_source": false
  }
--- !result
|
  {
    "took" : 2,
    "timed_out" : false,
    "_shards" : {
      "total" : 1,
      "successful" : 1,
      "skipped" : 0,
      "failed" : 0
    },
    "hits" : {
      "total" : {
        "value" : 1,
        "relation" : "eq"
      },
      "max_score" : 1.0,
      "hits" : [
        {
          "_index" : "my-index-000001",
          "_id" : "1",
          "_score" : 1.0,
          "fields" : {
            "session_data.object.some_field": [
              "some_value"
            ]
          }
        }
      ]
    }
  }
