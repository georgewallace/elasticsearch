# Source: elasticsearch/rest-apis/retrieve-selected-fields.md
--- !metadata
id: example-5
language: elastic_console
topic: retrieve-selected-fields
subtopic: default
example_order: 5
--- !code
|
  PUT my-index-000001
  {
    "mappings": {
      "properties": {
        "my-small" : { "type" : "keyword", "ignore_above": 2 }, 
        "my-large" : { "type" : "keyword" }
      }
    }
  }

  PUT my-index-000001/_doc/1?refresh=true
  {
    "my-small": ["ok", "bad"], 
    "my-large": "ok content"
  }

  POST my-index-000001/_search
  {
    "fields": ["my-*"],
    "_source": false
  }
--- !result
|
  {
    "took" : 2,
    "timed_out" : false,
    "_shards" : {
      "total" : 1,
      "successful" : 1,
      "skipped" : 0,
      "failed" : 0
    },
    "hits" : {
      "total" : {
        "value" : 1,
        "relation" : "eq"
      },
      "max_score" : 1.0,
      "hits" : [
        {
          "_index" : "my-index-000001",
          "_id" : "1",
          "_score" : 1.0,
          "_ignored" : [ "my-small"],
          "fields" : {
            "my-large": [
              "ok content"
            ],
            "my-small": [
              "ok"
            ]
          },
