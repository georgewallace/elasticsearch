--- !code
|
  POST my-index-000001/_search
  {
    "query": {
      "match": {
        "user.id": "kimchy"
      }
    },
    "fields": [
      "user.id",
      "http.response.*",         
      {
        "field": "@timestamp",
        "format": "epoch_millis" 
      }
    ],
    "_source": false
  }
