--- !metadata
id: example-2
language: elastic_console
topic: search-profile
subtopic: default
example_order: 2
--- !code
|
  GET /my-index-000001/_search
  {
    "profile": true,
    "query": {
      "term": {
        "user.id": {
          "value": "elkbee"
        }
      }
    },
    "aggs": {
      "my_scoped_agg": {
        "terms": {
          "field": "http.response.status_code"
        }
      },
      "my_global_agg": {
        "global": {},
        "aggs": {
          "my_level_agg": {
            "terms": {
              "field": "http.response.status_code"
            }
          }
        }
      }
    },
    "post_filter": {
      "match": {
        "message": "search"
      }
    }
  }
