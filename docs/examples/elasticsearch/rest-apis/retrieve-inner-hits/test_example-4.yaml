--- !metadata
id: example-4
language: elastic_console
topic: retrieve-inner-hits
subtopic: default
example_order: 4
--- !code
|
  PUT test
  {
    "mappings": {
      "properties": {
        "my_join_field": {
          "type": "join",
          "relations": {
            "my_parent": "my_child"
          }
        }
      }
    }
  }

  PUT test/_doc/1?refresh
  {
    "number": 1,
    "my_join_field": "my_parent"
  }

  PUT test/_doc/2?routing=1&refresh
  {
    "number": 1,
    "my_join_field": {
      "name": "my_child",
      "parent": "1"
    }
  }

  POST test/_search
  {
    "query": {
      "has_child": {
        "type": "my_child",
        "query": {
          "match": {
            "number": 1
          }
        },
        "inner_hits": {}    
      }
    }
  }
--- !result
|
  {
    ...,
    "hits": {
      "total": {
        "value": 1,
        "relation": "eq"
      },
      "max_score": 1.0,
      "hits": [
        {
          "_index": "test",
          "_id": "1",
          "_score": 1.0,
          "_source": {
            "number": 1,
            "my_join_field": "my_parent"
          },
          "inner_hits": {
            "my_child": {
              "hits": {
                "total": {
                  "value": 1,
                  "relation": "eq"
                },
                "max_score": 1.0,
                "hits": [
                  {
                    "_index": "test",
                    "_id": "2",
                    "_score": 1.0,
                    "_routing": "1",
                    "_source": {
                      "number": 1,
                      "my_join_field": {
                        "name": "my_child",
                        "parent": "1"
                      }
                    }
                  }
                ]
              }
            }
          }
        }
      ]
    }
  }
