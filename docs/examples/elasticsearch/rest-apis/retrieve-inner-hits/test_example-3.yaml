--- !code
|
  PUT test
  {
    "mappings": {
      "properties": {
        "comments": {
          "type": "nested",
          "properties": {
            "votes": {
              "type": "nested"
            }
          }
        }
      }
    }
  }

  PUT test/_doc/1?refresh
  {
    "title": "Test title",
    "comments": [
      {
        "author": "kimchy",
        "text": "comment text",
        "votes": []
      },
      {
        "author": "nik9000",
        "text": "words words words",
        "votes": [
          {"value": 1 , "voter": "kimchy"},
          {"value": -1, "voter": "other"}
        ]
      }
    ]
  }

  POST test/_search
  {
    "query": {
      "nested": {
        "path": "comments.votes",
          "query": {
            "match": {
              "comments.votes.voter": "kimchy"
            }
          },
          "inner_hits" : {}
      }
    }
  }
--- !result
|
  {
    ...,
    "hits": {
      "total" : {
          "value": 1,
          "relation": "eq"
      },
      "max_score": 0.6931471,
      "hits": [
        {
          "_index": "test",
          "_id": "1",
          "_score": 0.6931471,
          "_source": ...,
          "inner_hits": {
            "comments.votes": {
              "hits": {
                "total" : {
                    "value": 1,
                    "relation": "eq"
                },
                "max_score": 0.6931471,
                "hits": [
                  {
                    "_index": "test",
                    "_id": "1",
                    "_nested": {
                      "field": "comments",
                      "offset": 1,
                      "_nested": {
                        "field": "votes",
                        "offset": 0
                      }
                    },
                    "_score": 0.6931471,
                    "_source": {
                      "value": 1,
                      "voter": "kimchy"
                    }
                  }
                ]
              }
            }
          }
        }
      ]
    }
  }
