--- !metadata
id: example-24
language: elastic_console
topic: highlighting-examples
subtopic: default
example_order: 24
--- !code
|
  GET my-index-000001/_search
  {
    "query": {
      "match_phrase": { "message": "number 1" }
    },
    "highlight": {
      "fields": {
        "message": {
          "type": "plain",
          "fragment_size": 15,
          "number_of_fragments": 3,
          "fragmenter": "simple"
        }
      }
    }
  }
--- !result
|
  {
    ...
    "hits": {
      "total": {
        "value": 1,
        "relation": "eq"
      },
      "max_score": 1.6011951,
      "hits": [
        {
          "_index": "my-index-000001",
          "_id": "1",
          "_score": 1.6011951,
          "_source": {
            "message": "some message with the number 1",
            "context": "bar"
          },
          "highlight": {
            "message": [
              " with the <em>number</em>",
              " <em>1</em>"
            ]
          }
        }
      ]
    }
  }
