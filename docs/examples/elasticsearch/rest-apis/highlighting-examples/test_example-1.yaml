--- !code
|
  GET /_search
  {
    "query" : {
      "match": { "user.id": "kimchy" }
    },
    "highlight" : {
      "number_of_fragments" : 3,
      "fragment_size" : 150,
      "fields" : {
        "body" : { "pre_tags" : ["<em>"], "post_tags" : ["</em>"] },
        "blog.title" : { "number_of_fragments" : 0 },
        "blog.author" : { "number_of_fragments" : 0 },
        "blog.comment" : { "number_of_fragments" : 5, "order" : "score" }
      }
    }
  }
