--- !code
|
  GET /my-index-000001/_search
  {
    "query": {
      "match": {
        "message": "GET /search"
      }
    },
    "collapse": {
      "field": "geo.country_name",
      "inner_hits": {
        "name": "by_location",
        "collapse": { "field": "user.id" },
        "size": 3
      }
    }
  }
