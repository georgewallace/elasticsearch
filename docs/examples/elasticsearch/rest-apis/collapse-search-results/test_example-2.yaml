--- !metadata
id: example-2
language: elastic_console
topic: collapse-search-results
subtopic: default
example_order: 2
--- !code
|
  GET /my-index-000001/_search
  {
    "query": {
      "match": {
        "message": "GET /search"
      }
    },
    "collapse": {
      "field": "user.id",                       
      "inner_hits": {
        "name": "most_recent",                  
        "size": 5,                              
        "sort": [ { "@timestamp": "desc" } ]    
      },
      "max_concurrent_group_searches": 4        
    },
    "sort": [
      {
        "http.response.bytes": {
          "order": "desc"
        }
      }
    ]
  }
--- !result

