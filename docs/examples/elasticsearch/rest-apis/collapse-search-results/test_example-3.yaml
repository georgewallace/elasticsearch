--- !metadata
id: example-3
language: elastic_console
topic: collapse-search-results
subtopic: default
example_order: 3
--- !code
|
  GET /my-index-000001/_search
  {
    "query": {
      "match": {
        "message": "GET /search"
      }
    },
    "collapse": {
      "field": "user.id",                   
      "inner_hits": [
        {
          "name": "largest_responses",      
          "size": 3,
          "sort": [
            {
              "http.response.bytes": {
                "order": "desc"
              }
            }
          ]
        },
        {
          "name": "most_recent",             
          "size": 3,
          "sort": [
            {
              "@timestamp": {
                "order": "desc"
              }
            }
          ]
        }
      ]
    },
    "sort": [
      "http.response.bytes"
    ]
  }
--- !result

