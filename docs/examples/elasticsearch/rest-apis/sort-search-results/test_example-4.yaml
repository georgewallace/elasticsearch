--- !code
|
  PUT /my-index-000001/_doc/1?refresh
  {
     "product": "chocolate",
     "price": [20, 4]
  }

  POST /_search
  {
     "query" : {
        "term" : { "product" : "chocolate" }
     },
     "sort" : [
        {"price" : {"order" : "asc", "mode" : "avg"}}
     ]
  }
