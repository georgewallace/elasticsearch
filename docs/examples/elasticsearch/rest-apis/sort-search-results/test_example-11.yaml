|
  POST /_search
  {
     "query" : {
        "term" : { "product" : "chocolate" }
     },
     "sort" : [
         {
            "offer.price" : {
               "mode" :  "avg",
               "order" : "asc",
               "nested": {
                  "path": "offer",
                  "filter": {
                     "term" : { "offer.color" : "blue" }
                  }
               }
            }
         }
      ]
  }
