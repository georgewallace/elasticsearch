--- !code
|
  PUT /my-index-000001
  { "mappings": {
      "properties": {
        "text": {
          "type": "text",
          "term_vector": "with_positions_offsets_payloads",
          "store" : true,
          "analyzer" : "fulltext_analyzer"
         },
         "fullname": {
          "type": "text",
          "term_vector": "with_positions_offsets_payloads",
          "analyzer" : "fulltext_analyzer"
        }
      }
    },
    "settings" : {
      "index" : {
        "number_of_shards" : 1,
        "number_of_replicas" : 0
      },
      "analysis": {
        "analyzer": {
          "fulltext_analyzer": {
            "type": "custom",
            "tokenizer": "whitespace",
            "filter": [
              "lowercase",
              "type_as_payload"
            ]
          }
        }
      }
    }
  }
