--- !code
|
  GET /my-index-000001/_search
  {
    "retriever": {
      "rule": {
        "retriever": {
          "standard": {
            "query": {
              "query_string": {
                "query": "puggles"
              }
            }
          }
        },
        "match_criteria": {
          "query_string": "puggles",
          "user_country": "us"
        },
        "ruleset_ids": [ "my-ruleset" ]
      }
    }
  }
