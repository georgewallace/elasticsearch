--- !metadata
id: example-4
language: elastic_console
topic: similarity
subtopic: default
example_order: 4
--- !code
|
  PUT /index
  {
    "settings": {
      "number_of_shards": 1,
      "similarity": {
        "scripted_tfidf": {
          "type": "scripted",
          "weight_script": {
            "source": "double idf = Math.log((field.docCount+1.0)/(term.docFreq+1.0)) + 1.0; return query.boost * idf;"
          },
          "script": {
            "source": "double tf = Math.sqrt(doc.freq); double norm = 1/Math.sqrt(doc.length); return weight * tf * norm;"
          }
        }
      }
    },
    "mappings": {
      "properties": {
        "field": {
          "type": "text",
          "similarity": "scripted_tfidf"
        }
      }
    }
  }
--- !result

