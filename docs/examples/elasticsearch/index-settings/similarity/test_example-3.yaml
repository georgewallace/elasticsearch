# Source: elasticsearch/index-settings/similarity.md
--- !metadata
id: example-3
language: elastic_console
topic: similarity
subtopic: default
example_order: 3
--- !code
|
  PUT /index
  {
    "settings": {
      "number_of_shards": 1,
      "similarity": {
        "scripted_tfidf": {
          "type": "scripted",
          "script": {
            "source": "double tf = Math.sqrt(doc.freq); double idf = Math.log((field.docCount+1.0)/(term.docFreq+1.0)) + 1.0; double norm = 1/Math.sqrt(doc.length); return query.boost * tf * idf * norm;"
          }
        }
      }
    },
    "mappings": {
      "properties": {
        "field": {
          "type": "text",
          "similarity": "scripted_tfidf"
        }
      }
    }
  }

  PUT /index/_doc/1
  {
    "field": "foo bar foo"
  }

  PUT /index/_doc/2
  {
    "field": "bar baz"
  }

  POST /index/_refresh

  GET /index/_search?explain=true
  {
    "query": {
      "query_string": {
        "query": "foo^1.7",
        "default_field": "field"
      }
    }
  }
