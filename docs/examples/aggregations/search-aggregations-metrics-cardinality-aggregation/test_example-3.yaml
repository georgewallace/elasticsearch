--- !code
|
  POST /sales/_search?size=0
  {
    "runtime_mappings": {
      "type_and_promoted": {
        "type": "keyword",
        "script": "emit(doc['type'].value + ' ' + doc['promoted'].value)"
      }
    },
    "aggs": {
      "type_promoted_count": {
        "cardinality": {
          "field": "type_and_promoted"
        }
      }
    }
  }
--- !result

