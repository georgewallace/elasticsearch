--- !metadata
id: example-4
language: elastic_console
topic: search-aggregations-metrics-percentile-aggregation
subtopic: default
example_order: 4
--- !code
|
  GET latency/_search
  {
    "size": 0,
    "runtime_mappings": {
      "load_time.seconds": {
        "type": "long",
        "script": {
          "source": "emit(doc['load_time'].value / params.timeUnit)",
          "params": {
            "timeUnit": 1000
          }
        }
      }
    },
    "aggs": {
      "load_time_outlier": {
        "percentiles": {
          "field": "load_time.seconds"
        }
      }
    }
  }
--- !result

