--- !code
|
  GET latency/_search
  {
    "size": 0,
    "aggs": {
      "load_time_outlier": {
        "percentiles": {
          "field": "load_time",
          "percents": [ 95, 99, 99.9 ],
          "hdr": {                                  
            "number_of_significant_value_digits": 3 
          }
        }
      }
    }
  }
--- !result

