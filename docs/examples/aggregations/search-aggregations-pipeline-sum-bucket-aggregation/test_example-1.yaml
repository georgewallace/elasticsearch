--- !code
|
  POST /sales/_search
  {
    "size": 0,
    "aggs": {
      "sales_per_month": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"
        },
        "aggs": {
          "sales": {
            "sum": {
              "field": "price"
            }
          }
        }
      },
      "sum_monthly_sales": {
        "sum_bucket": {
          "buckets_path": "sales_per_month>sales" 
        }
      }
    }
  }
