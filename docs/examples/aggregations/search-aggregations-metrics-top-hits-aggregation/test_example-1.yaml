--- !metadata
id: example-1
language: elastic_console
topic: search-aggregations-metrics-top-hits-aggregation
subtopic: default
example_order: 1
--- !code
|
  POST /sales/_search?size=0
  {
    "aggs": {
      "top_tags": {
        "terms": {
          "field": "type",
          "size": 3
        },
        "aggs": {
          "top_sales_hits": {
            "top_hits": {
              "sort": [
                {
                  "date": {
                    "order": "desc"
                  }
                }
              ],
              "_source": {
                "includes": [ "date", "price" ]
              },
              "size": 1
            }
          }
        }
      }
    }
  }
--- !result
|
  {
    ...
    "aggregations": {
      "top_tags": {
         "doc_count_error_upper_bound": 0,
         "sum_other_doc_count": 0,
         "buckets": ...
      }
    }
  }
