--- !code
|
  POST /sales/_search
  {
    "query": {
      "term": { "tags": "car" }
    },
    "aggs": {
      "by_sale": {
        "nested": {
          "path": "comments"
        },
        "aggs": {
          "by_user": {
            "terms": {
              "field": "comments.username",
              "size": 1
            },
            "aggs": {
              "by_nested": {
                "top_hits": {}
              }
            }
          }
        }
      }
    }
  }
--- !result
|
  {
    ...
    "aggregations": {
      "by_sale": {
        "by_user": {
          "buckets": [
            {
              "key": "baddriver007",
