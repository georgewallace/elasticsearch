--- !code
|
  POST /sales/_search
  {
    "query": {
      "match": {
        "body": "elections"
      }
    },
    "aggs": {
      "top_sites": {
        "terms": {
          "field": "domain",
          "order": {
            "top_hit": "desc"
          }
        },
        "aggs": {
          "top_tags_hits": {
            "top_hits": {}
          },
          "top_hit" : {
            "max": {
              "script": {
                "source": "_score"
              }
            }
          }
        }
      }
    }
  }
--- !result

