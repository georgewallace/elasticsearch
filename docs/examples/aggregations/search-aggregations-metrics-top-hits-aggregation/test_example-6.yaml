--- !metadata
id: example-6
language: elastic_console
topic: search-aggregations-metrics-top-hits-aggregation
subtopic: default
example_order: 6
--- !code
|
  POST /sales/_search?size=0
  {
    "aggs": {
      "top_tags": {
        "terms": {
          "field": "type",
          "size": 3
        },
        "aggs": {
          "top_sales_hits": {
            "top_hits": {
              "sort": [
                {
                  "date": {
                    "order": "desc"
                  }
                }
              ],
              "_source": {
                "includes": [ "date", "price" ]
              },
              "size": 1
            }
          },
          "having.top_salary": {
            "bucket_selector": {
              "buckets_path": {
                "tp": "top_sales_hits[_source.price]"
              },
              "script": "params.tp < 180"
            }
          }
        }
      }
    }
  }
--- !result

