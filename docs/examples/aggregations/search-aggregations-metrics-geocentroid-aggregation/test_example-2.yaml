--- !code
|
  POST /museums/_search?size=0
  {
    "aggs": {
      "cities": {
        "terms": { "field": "city.keyword" },
        "aggs": {
          "centroid": {
            "geo_centroid": { "field": "location" }
          }
        }
      }
    }
  }
