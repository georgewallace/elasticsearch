--- !code
|
  POST /sales/_search
  {
    "size": 0,
    "aggs": {
      "sales_per_month": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"
        },
        "aggs": {
          "sales": {
            "sum": {
              "field": "price"
            }
          },
          "cumulative_sales": {
            "cumulative_sum": {
              "buckets_path": "sales" 
            }
          }
        }
      }
    }
  }
