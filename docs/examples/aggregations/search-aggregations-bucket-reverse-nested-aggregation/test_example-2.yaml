--- !code
|
  GET /issues/_search
  {
    "query": {
      "match_all": {}
    },
    "aggs": {
      "comments": {
        "nested": {
          "path": "comments"
        },
        "aggs": {
          "top_usernames": {
            "terms": {
              "field": "comments.username"
            },
            "aggs": {
              "comment_to_issue": {
                "reverse_nested": {}, 
                "aggs": {
                  "top_tags_per_comment": {
                    "terms": {
                      "field": "tags"
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
--- !result
|
  {
    "aggregations": {
      "comments": {
        "doc_count": 1,
        "top_usernames": {
          "doc_count_error_upper_bound" : 0,
          "sum_other_doc_count" : 0,
          "buckets": [
            {
              "key": "username_1",
              "doc_count": 1,
              "comment_to_issue": {
                "doc_count": 1,
                "top_tags_per_comment": {
                  "doc_count_error_upper_bound" : 0,
                  "sum_other_doc_count" : 0,
                  "buckets": [
                    {
                      "key": "tag_1",
                      "doc_count": 1
                    }
                    ...
                  ]
                }
              }
            }
            ...
          ]
        }
      }
    }
  }
