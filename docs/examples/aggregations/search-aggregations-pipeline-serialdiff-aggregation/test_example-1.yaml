--- !code
|
  POST /_search
  {
     "size": 0,
     "aggs": {
        "my_date_histo": {                  
           "date_histogram": {
              "field": "timestamp",
              "calendar_interval": "day"
           },
           "aggs": {
              "the_sum": {
                 "sum": {
                    "field": "lemmings"     
                 }
              },
              "thirtieth_difference": {
                 "serial_diff": {                
                    "buckets_path": "the_sum",
                    "lag" : 30
                 }
              }
           }
        }
     }
  }
