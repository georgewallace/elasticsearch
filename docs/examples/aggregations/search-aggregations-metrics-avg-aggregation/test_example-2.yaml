--- !code
|
  POST /exams/_search?size=0
  {
    "runtime_mappings": {
      "grade.corrected": {
        "type": "double",
        "script": {
          "source": "emit(Math.min(100, doc['grade'].value * params.correction))",
          "params": {
            "correction": 1.2
          }
        }
      }
    },
    "aggs": {
      "avg_corrected_grade": {
        "avg": {
          "field": "grade.corrected"
        }
      }
    }
  }
--- !result

