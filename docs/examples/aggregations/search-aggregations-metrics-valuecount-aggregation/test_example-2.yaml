--- !code
|
  POST /sales/_search
  {
    "size": 0,
    "runtime_mappings": {
      "tags": {
        "type": "keyword",
        "script": """
          emit(doc['type'].value);
          if (doc['promoted'].value) {
            emit('hot');
          }
        """
      }
    },
    "aggs": {
      "tags_count": {
        "value_count": {
          "field": "tags"
        }
      }
    }
  }
--- !result

