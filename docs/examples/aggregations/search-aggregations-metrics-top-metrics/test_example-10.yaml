        "aggs": {
          "tm": {
            "top_metrics": {
              "metrics": {"field": "m"},
              "sort": {"s": "desc"},
              "size": 1
            }
          },
          "having_tm": {
            "bucket_selector": {
              "buckets_path": {
                "top_m": "tm[m]"
              },
              "script": "params.top_m < 1000"
            }
          }
        }
      }
    }
  }
