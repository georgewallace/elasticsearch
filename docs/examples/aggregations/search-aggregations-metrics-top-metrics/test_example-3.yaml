--- !code
|
  PUT /my-index
  {
    "mappings": {
      "properties": {
        "nr":    { "type": "integer" },
        "state":  { "type": "keyword"  } 
      }
    }
  }
  POST /my-index/_bulk?refresh
  {"index": {}}
  {"nr": 1, "state": "started"}
  {"index": {}}
  {"nr": 2, "state": "stopped"}
  {"index": {}}
  {"nr": 3, "state": "N/A"}
  {"index": {}}
  {"nr": 4} 
  POST /my-index/_search?filter_path=aggregations
  {
    "aggs": {
      "my_top_metrics": {
        "top_metrics": {
          "metrics": {
            "field": "state",
            "missing": "N/A"}, 
          "sort": {"nr": "desc"}
        }
      }
    }
  }
