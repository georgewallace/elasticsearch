# Source: search-aggregations-metrics-weight-avg-aggregation.md
--- !metadata
id: example-3
language: elastic_console
topic: search-aggregations-metrics-weight-avg-aggregation
subtopic: default
example_order: 3
--- !code
|
  POST /exams/_doc?refresh
  {
    "grade": 100,
    "weight": [2, 3]
  }
  POST /exams/_doc?refresh
  {
    "grade": 80,
    "weight": 3
  }

  POST /exams/_search?filter_path=aggregations
  {
    "size": 0,
    "runtime_mappings": {
      "weight.combined": {
        "type": "double",
        "script": """
          double s = 0;
          for (double w : doc['weight']) {
            s += w;
          }
          emit(s);
        """
      }
    },
    "aggs": {
      "weighted_grade": {
        "weighted_avg": {
          "value": {
            "script": "doc.grade.value + 1"
          },
          "weight": {
            "field": "weight.combined"
          }
        }
      }
    }
  }
--- !result
|
  {
    "aggregations": {
      "weighted_grade": {
        "value": 93.5
      }
    }
  }
