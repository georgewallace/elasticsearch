--- !code
|
  POST /kibana_sample_data_ecommerce/_async_search
  {
    "size": 0,
    "aggs": {
      "my_agg": {
        "frequent_item_sets": {
          "minimum_set_size": 3,
          "fields": [
            { "field": "category.keyword" },
            { "field": "geoip.city_name" }
          ],
          "size": 3,
          "filter": {
            "term": {
              "geoip.continent_name": "Europe"
            }
          }
        }
      }
    }
  }
