--- !metadata
id: example-4
language: elastic_console
topic: search-aggregations-bucket-frequent-item-sets-aggregation
subtopic: default
example_order: 4
--- !code
|
  GET kibana_sample_data_ecommerce/_search
  {
    "runtime_mappings": {
      "price_range": {
        "type": "keyword",
        "script": {
          "source": """
             def bucket_start = (long) Math.floor(doc['taxful_total_price'].value / 50) * 50;
             def bucket_end = bucket_start + 50;
             emit(bucket_start.toString() + "-" + bucket_end.toString());
          """
        }
      }
    },
    "size": 0,
    "aggs": {
      "my_agg": {
        "frequent_item_sets": {
          "minimum_set_size": 4,
          "fields": [
            {
              "field": "category.keyword"
            },
            {
              "field": "price_range"
            },
            {
              "field": "geoip.city_name"
            }
          ],
          "size": 3
        }
      }
    }
  }
