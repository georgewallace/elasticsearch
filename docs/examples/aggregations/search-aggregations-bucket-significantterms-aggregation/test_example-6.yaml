--- !code
|
  GET /_search
  {
    "query": {
      "match": {
        "city": "madrid"
      }
    },
    "aggs": {
      "tags": {
        "significant_terms": {
          "field": "tag",
          "background_filter": {
            "term": { "text": "spain" }
          }
        }
      }
    }
  }
