--- !code
|
  GET news/_search
  {
    "query": {
      "match": {
        "custom_all": "elasticsearch"
      }
    },
    "aggs": {
      "tags": {
        "significant_text": {
          "field": "custom_all",
          "source_fields": [ "content", "title" ]
        }
      }
    }
  }
