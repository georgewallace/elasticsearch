--- !code
|
  GET news/_search
  {
    "query": {
      "match": {
        "content": "madrid"
      }
    },
    "aggs": {
      "tags": {
        "significant_text": {
          "field": "content",
          "background_filter": {
            "term": { "content": "spain" }
          }
        }
      }
    }
  }
