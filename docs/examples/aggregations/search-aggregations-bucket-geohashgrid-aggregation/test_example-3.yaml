--- !code
|
  POST /museums/_search?size=0
  {
    "aggregations": {
      "zoomed-in": {
        "filter": {
          "geo_bounding_box": {
            "location": {
              "top_left": "u17",
              "bottom_right": "u17"
            }
          }
        },
        "aggregations": {
          "zoom1": {
            "geohash_grid": {
              "field": "location",
              "precision": 8
            }
          }
        }
      }
    }
  }
