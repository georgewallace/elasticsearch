--- !code
|
  POST /museums/_search?size=0
  {
    "aggregations": {
      "zoomed-in": {
        "filter": {
          "geo_bounding_box": {
            "location": {
              "top_left": "POINT (4.9 52.4)",
              "bottom_right": "POINT (5.0 52.3)"
            }
          }
        },
        "aggregations": {
          "zoom1": {
            "geohash_grid": {
              "field": "location",
              "precision": 8
            }
          }
        }
      }
    }
  }
