|
  POST /sales/_search?size=0
  {
     "aggs": {
         "range": {
             "date_range": {
                 "field": "date",
                 "missing": "1976/11/30",
                 "ranges": [
                    {
                      "key": "Older",
                      "to": "2016/02/01"
                    }, 
                    {
                      "key": "Newer",
                      "from": "2016/02/01",
                      "to" : "now/d"
                    }
                ]
            }
        }
     }
  }
