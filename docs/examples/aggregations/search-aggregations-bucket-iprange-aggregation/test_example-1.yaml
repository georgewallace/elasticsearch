--- !code
|
  GET /ip_addresses/_search
  {
    "size": 10,
    "aggs": {
      "ip_ranges": {
        "ip_range": {
          "field": "ip",
          "ranges": [
            { "to": "10.0.0.5" },
            { "from": "10.0.0.5" }
          ]
        }
      }
    }
  }
--- !result
|
  {
    ...

    "aggregations": {
      "ip_ranges": {
        "buckets": [
          {
            "key": "*-10.0.0.5",
            "to": "10.0.0.5",
            "doc_count": 10
          },
          {
            "key": "10.0.0.5-*",
            "from": "10.0.0.5",
            "doc_count": 260
          }
        ]
      }
    }
  }
