# Source: search-aggregations-pipeline-bucket-script-aggregation.md
--- !metadata
id: example-1
language: elastic_console
topic: search-aggregations-pipeline-bucket-script-aggregation
subtopic: default
example_order: 1
--- !code
|
  POST /sales/_search
  {
    "size": 0,
    "aggs": {
      "sales_per_month": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"
        },
        "aggs": {
          "total_sales": {
            "sum": {
              "field": "price"
            }
          },
          "t-shirts": {
            "filter": {
              "term": {
                "type": "t-shirt"
              }
            },
            "aggs": {
              "sales": {
                "sum": {
                  "field": "price"
                }
              }
            }
          },
          "t-shirt-percentage": {
            "bucket_script": {
              "buckets_path": {
                "tShirtSales": "t-shirts>sales",
                "totalSales": "total_sales"
              },
              "script": "params.tShirtSales / params.totalSales * 100"
            }
          }
        }
      }
    }
  }
