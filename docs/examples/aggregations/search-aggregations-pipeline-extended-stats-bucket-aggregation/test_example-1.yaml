--- !code
|
  POST /sales/_search
  {
    "size": 0,
    "aggs": {
      "sales_per_month": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"
        },
        "aggs": {
          "sales": {
            "sum": {
              "field": "price"
            }
          }
        }
      },
      "stats_monthly_sales": {
        "extended_stats_bucket": {
          "buckets_path": "sales_per_month>sales" 
        }
      }
    }
  }
