--- !metadata
id: example-2
language: elastic_console
topic: search-aggregations-pipeline-cumulative-cardinality-aggregation
subtopic: default
example_order: 2
--- !code
|
  GET /user_hits/_search
  {
    "size": 0,
    "aggs": {
      "users_per_day": {
        "date_histogram": {
          "field": "timestamp",
          "calendar_interval": "day"
        },
        "aggs": {
          "distinct_users": {
            "cardinality": {
              "field": "user_id"
            }
          },
          "total_new_users": {
            "cumulative_cardinality": {
              "buckets_path": "distinct_users"
            }
          },
          "incremental_new_users": {
            "derivative": {
              "buckets_path": "total_new_users"
            }
          }
        }
      }
    }
  }
