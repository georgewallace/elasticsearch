--- !metadata
id: example-3
language: elastic_console
topic: search-aggregations-metrics-extendedstats-aggregation
subtopic: default
example_order: 3
--- !code
|
  GET /exams/_search
  {
    "size": 0,
    "runtime_mappings": {
      "grade.corrected": {
        "type": "double",
        "script": {
          "source": "emit(Math.min(100, doc['grade'].value * params.correction))",
          "params": {
            "correction": 1.2
          }
        }
      }
    },
    "aggs": {
      "grades_stats": {
        "extended_stats": { "field": "grade.corrected" }
      }
    }
  }
--- !result

