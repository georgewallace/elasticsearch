--- !code
|
  POST /range_index/_search?size=0
  {
    "query": {
      "range": {
        "time_frame": {
          "gte": "2019-11-01",
          "format": "yyyy-MM-dd"
        }
      }
    },
    "aggs": {
      "november_data": {
        "date_histogram": {
          "field": "time_frame",
          "calendar_interval": "day",
          "format": "yyyy-MM-dd"
        }
      }
    }
  }
