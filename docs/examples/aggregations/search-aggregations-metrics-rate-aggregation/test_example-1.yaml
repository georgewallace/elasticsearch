--- !code
|
  GET sales/_search
  {
    "size": 0,
    "aggs": {
      "by_date": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"  
        },
        "aggs": {
          "my_rate": {
            "rate": {
              "unit": "year"  
            }
          }
        }
      }
    }
  }
