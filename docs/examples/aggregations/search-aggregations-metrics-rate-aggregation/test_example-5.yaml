language: elastic_console
topic: search-aggregations-metrics-rate-aggregation
subtopic: default
example_order: 5
--- !code
|
  GET sales/_search
  {
    "size": 0,
    "runtime_mappings": {
      "price.adjusted": {
        "type": "double",
        "script": {
          "source": "emit(doc['price'].value * params.adjustment)",
          "params": {
            "adjustment": 0.9
          }
        }
      }
    },
    "aggs": {
      "by_date": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"
        },
        "aggs": {
          "avg_price": {
            "rate": {
              "field": "price.adjusted"
            }
          }
        }
      }
    }
  }
--- !result
|
  {
    ...
    "aggregations" : {
      "by_date" : {
        "buckets" : ...
      }
    }
  }
