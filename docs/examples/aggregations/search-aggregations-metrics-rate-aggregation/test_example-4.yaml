--- !code
|
  GET sales/_search
  {
    "size": 0,
    "aggs": {
      "by_date": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"  
        },
        "aggs": {
          "avg_number_of_sales_per_year": {
            "rate": {
              "field": "price", 
              "unit": "year",  
              "mode": "value_count" 
            }
          }
        }
      }
    }
  }
