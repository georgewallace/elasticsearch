--- !metadata
id: example-2
language: elastic_console
topic: search-aggregations-bucket-multi-terms-aggregation
subtopic: default
example_order: 2
--- !code
|
  GET /products/_search
  {
    "runtime_mappings": {
      "genre.length": {
        "type": "long",
        "script": "emit(doc['genre'].value.length())"
      }
    },
    "aggs": {
      "genres_and_products": {
        "multi_terms": {
          "terms": [
            {
              "field": "genre.length"
            },
            {
              "field": "product"
            }
          ]
        }
      }
    }
  }
--- !result
