--- !code
|
  GET /products/_search
  {
    "aggs": {
      "genres_and_products": {
        "multi_terms": {
          "terms": [
            {
              "field": "genre"
            },
            {
              "field": "product"
            }
          ],
          "order": {
            "total_quantity": "desc"
          }
        },
        "aggs": {
          "total_quantity": {
            "sum": {
              "field": "quantity"
            }
          }
        }
      }
    }
  }
