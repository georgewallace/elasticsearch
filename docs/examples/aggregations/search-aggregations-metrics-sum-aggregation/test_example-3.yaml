  POST /sales/_search?size=0
  {
    "query": {
      "constant_score": {
        "filter": {
          "match": { "type": "hat" }
        }
      }
    },
    "aggs": {
      "hat_prices": {
        "sum": {
          "field": "price",
          "missing": 100
        }
      }
    }
  }
