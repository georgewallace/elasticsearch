--- !metadata
id: example-3
language: elastic_console
topic: search-aggregations-metrics-median-absolute-deviation-aggregation
subtopic: default
example_order: 3
--- !code
|
  GET reviews/_search?filter_path=aggregations
  {
    "size": 0,
    "runtime_mappings": {
      "rating.out_of_ten": {
        "type": "long",
        "script": {
          "source": "emit(doc['rating'].value * params.scaleFactor)",
          "params": {
            "scaleFactor": 2
          }
        }
      }
    },
    "aggs": {
      "review_average": {
        "avg": {
          "field": "rating.out_of_ten"
        }
      },
      "review_variability": {
        "median_absolute_deviation": {
          "field": "rating.out_of_ten"
        }
      }
    }
  }
--- !result
|
  {
    "aggregations": {
      "review_average": {
        "value": 6.0
      },
      "review_variability": {
        "value": 4.0
      }
    }
  }
