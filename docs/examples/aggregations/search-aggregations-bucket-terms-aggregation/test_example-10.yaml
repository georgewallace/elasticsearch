--- !metadata
id: example-10
language: elastic_console
topic: search-aggregations-bucket-terms-aggregation
subtopic: default
example_order: 10
--- !code
|
  GET /_search
  {
    "size": 0,
    "runtime_mappings": {
      "normalized_genre": {
        "type": "keyword",
        "script": """
          String genre = doc['genre'].value;
          if (doc['product'].value.startsWith('Anthology')) {
            emit(genre + ' anthology');
          } else {
            emit(genre);
          }
        """
      }
    },
    "aggs": {
      "genres": {
        "terms": {
          "field": "normalized_genre"
        }
      }
    }
  }
--- !result
|
  {
    "aggregations": {
      "genres": {
        "doc_count_error_upper_bound": 0,
        "sum_other_doc_count": 0,
        "buckets": [
          {
            "key": "electronic",
            "doc_count": 4
          },
          {
            "key": "rock",
            "doc_count": 3
          },
          {
            "key": "electronic anthology",
            "doc_count": 2
          },
          {
            "key": "jazz",
            "doc_count": 2
          }
        ]
      }
    },
    ...
  }
