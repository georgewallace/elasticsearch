--- !code
|
  GET /_search
  {
    "aggs": {
      "JapaneseCars": {
        "terms": {
          "field": "make",
          "include": [ "mazda", "honda" ]
        }
      },
      "ActiveCarManufacturers": {
        "terms": {
          "field": "make",
          "exclude": [ "rover", "jensen" ]
        }
      }
    }
  }
--- !result

