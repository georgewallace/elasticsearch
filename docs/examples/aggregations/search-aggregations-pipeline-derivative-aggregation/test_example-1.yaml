--- !metadata
id: example-1
language: elastic_console
topic: search-aggregations-pipeline-derivative-aggregation
subtopic: default
example_order: 1
--- !code
|
  POST /sales/_search
  {
    "size": 0,
    "aggs": {
      "sales_per_month": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"
        },
        "aggs": {
          "sales": {
            "sum": {
              "field": "price"
            }
          },
          "sales_deriv": {
            "derivative": {
              "buckets_path": "sales" 
            }
          }
        }
      }
    }
  }
