--- !code
|
  POST /sales/_search
  {
    "size": 0,
    "aggs": {
      "sales_per_month": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"
        },
        "aggs": {
          "sales": {
            "sum": {
              "field": "price"
            }
          },
          "sales_deriv": {
            "derivative": {
              "buckets_path": "sales"
            }
          },
          "sales_2nd_deriv": {
            "derivative": {
              "buckets_path": "sales_deriv" 
            }
          }
        }
      }
    }
  }
