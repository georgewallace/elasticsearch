--- !code
|
  POST /stackoverflow/_search?size=0
  {
    "query": {
      "query_string": {
        "query": "tags:elasticsearch"
      }
    },
    "aggs": {
      "my_unbiased_sample": {
        "diversified_sampler": {
          "shard_size": 200,
          "field": "author"
        },
        "aggs": {
          "keywords": {
            "significant_terms": {
              "field": "tags",
              "exclude": [ "elasticsearch" ]
            }
          }
        }
      }
    }
  }
