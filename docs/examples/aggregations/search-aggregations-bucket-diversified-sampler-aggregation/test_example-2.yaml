--- !code
|
  POST /stackoverflow/_search?size=0
  {
    "query": {
      "query_string": {
        "query": "tags:kibana"
      }
    },
    "runtime_mappings": {
      "tags.hash": {
        "type": "long",
        "script": "emit(doc['tags'].hashCode())"
      }
    },
    "aggs": {
      "my_unbiased_sample": {
        "diversified_sampler": {
          "shard_size": 200,
          "max_docs_per_value": 3,
          "field": "tags.hash"
        },
        "aggs": {
          "keywords": {
            "significant_terms": {
              "field": "tags",
              "exclude": [ "kibana" ]
            }
          }
        }
      }
    }
  }
--- !result
|
  {
    ...
    "aggregations": {
      "my_unbiased_sample": {
        "doc_count": 6,
        "keywords": {
          "doc_count": 6,
