--- !code
|
  PUT my-index-000001/_doc/1?refresh
  {
    "date": "2015-10-01T05:30:00Z"
  }

  PUT my-index-000001/_doc/2?refresh
  {
    "date": "2015-10-01T06:30:00Z"
  }

  GET my-index-000001/_search?size=0
  {
    "aggs": {
      "by_day": {
        "date_histogram": {
          "field":     "date",
          "calendar_interval":  "day",
          "offset":    "+6h"
        }
      }
    }
  }
