--- !metadata
id: example-13
language: elastic_console
topic: search-aggregations-bucket-datehistogram-aggregation
subtopic: default
example_order: 13
--- !code
|
  POST /sales/_search?size=0
  {
    "runtime_mappings": {
      "date.promoted_is_tomorrow": {
        "type": "date",
        "script": """
          long date = doc['date'].value.toInstant().toEpochMilli();
          if (doc['promoted'].value) {
            date += 86400;
          }
          emit(date);
        """
      }
    },
    "aggs": {
      "sales_over_time": {
        "date_histogram": {
          "field": "date.promoted_is_tomorrow",
          "calendar_interval": "1M"
        }
      }
    }
  }
--- !result

