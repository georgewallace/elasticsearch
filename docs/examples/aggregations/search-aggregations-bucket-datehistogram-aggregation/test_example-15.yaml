--- !code
|
  POST /sales/_search?size=0
  {
    "runtime_mappings": {
      "date.day_of_week": {
        "type": "keyword",
        "script": "emit(doc['date'].value.dayOfWeekEnum.getDisplayName(TextStyle.FULL, Locale.ENGLISH))"
      }
    },
    "aggs": {
      "day_of_week": {
        "terms": { "field": "date.day_of_week" }
      }
    }
  }
--- !result
|
  {
    ...
    "aggregations": {
      "day_of_week": {
        "doc_count_error_upper_bound": 0,
        "sum_other_doc_count": 0,
        "buckets": [
          {
            "key": "Sunday",
            "doc_count": 4
          },
          {
            "key": "Thursday",
            "doc_count": 3
          }
        ]
      }
    }
  }
