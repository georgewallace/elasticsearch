--- !metadata
id: example-1
language: elastic_console
topic: search-aggregations-pipeline-bucket-sort-aggregation
subtopic: default
example_order: 1
--- !code
|
  POST /sales/_search
  {
    "size": 0,
    "aggs": {
      "sales_per_month": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"
        },
        "aggs": {
          "total_sales": {
            "sum": {
              "field": "price"
            }
          },
          "sales_bucket_sort": {
            "bucket_sort": {
              "sort": [
                { "total_sales": { "order": "desc" } } 
              ],
              "size": 3                                
            }
          }
        }
      }
    }
  }
--- !result
