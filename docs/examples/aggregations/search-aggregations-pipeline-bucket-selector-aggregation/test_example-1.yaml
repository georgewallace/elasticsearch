--- !metadata
id: example-1
language: elastic_console
topic: search-aggregations-pipeline-bucket-selector-aggregation
subtopic: default
example_order: 1
--- !code
|
  POST /sales/_search
  {
    "size": 0,
    "aggs": {
      "sales_per_month": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"
        },
        "aggs": {
          "total_sales": {
            "sum": {
              "field": "price"
            }
          },
          "sales_bucket_filter": {
            "bucket_selector": {
              "buckets_path": {
                "totalSales": "total_sales"
              },
              "script": "params.totalSales > 200"
            }
          }
        }
      }
    }
  }
--- !result
