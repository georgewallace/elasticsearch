--- !code
|
  POST /museums/_search?size=0
  {
    "aggs": {
      "rings_around_amsterdam": {
        "geo_distance": {
          "field": "location",
          "origin": "POINT (4.894 52.3760)",
          "ranges": [
            { "to": 100000, "key": "first_ring" },
            { "from": 100000, "to": 300000, "key": "second_ring" },
            { "from": 300000, "key": "third_ring" }
          ],
          "keyed": true
        }
      }
    }
  }
--- !result
