  {
    ...
    "aggregations": {
      "rings_around_amsterdam": {
        "buckets": {
          "first_ring": {
            "from": 0.0,
            "to": 100000.0,
            "doc_count": 3
          },
          "second_ring": {
            "from": 100000.0,
            "to": 300000.0,
            "doc_count": 1
          },
          "third_ring": {
            "from": 300000.0,
            "doc_count": 2
          }
        }
      }
    }
  }
