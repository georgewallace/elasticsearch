--- !metadata
id: example-1
language: elastic_console
topic: search-aggregations-pipeline-movfn-aggregation
subtopic: default
example_order: 1
--- !code
|
  POST /_search
  {
    "size": 0,
    "aggs": {
      "my_date_histo": {                  
        "date_histogram": {
          "field": "date",
          "calendar_interval": "1M"
        },
        "aggs": {
          "the_sum": {
            "sum": { "field": "price" }   
          },
          "the_movfn": {
            "moving_fn": {
              "buckets_path": "the_sum",  
              "window": 10,
              "script": "MovingFunctions.unweightedAvg(values)"
            }
          }
        }
      }
    }
  }
