--- !code
|
  POST /_search
  {
    "size": 0,
    "aggs": {
      "my_date_histo": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "1M"
        },
        "aggs": {
          "the_sum": {
            "sum": { "field": "price" }
          },
          "the_movavg": {
            "moving_fn": {
              "buckets_path": "the_sum",
              "window": 10,
              "script": "return values.length > 0 ? values[0] : Double.NaN"
            }
          }
        }
      }
    }
  }
--- !result

