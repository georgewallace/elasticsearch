# Source: search-aggregations-bucket-adjacency-matrix-aggregation.md
--- !metadata
id: example-1
language: elastic_console
topic: search-aggregations-bucket-adjacency-matrix-aggregation
subtopic: default
example_order: 1
--- !code
|
  PUT emails/_bulk?refresh
  { "index" : { "_id" : 1 } }
  { "accounts" : ["hillary", "sidney"]}
  { "index" : { "_id" : 2 } }
  { "accounts" : ["hillary", "donald"]}
  { "index" : { "_id" : 3 } }
  { "accounts" : ["vladimir", "donald"]}

  GET emails/_search
  {
    "size": 0,
    "aggs" : {
      "interactions" : {
        "adjacency_matrix" : {
          "filters" : {
            "grpA" : { "terms" : { "accounts" : ["hillary", "sidney"] }},
            "grpB" : { "terms" : { "accounts" : ["donald", "mitt"] }},
            "grpC" : { "terms" : { "accounts" : ["vladimir", "nigel"] }}
          }
        }
      }
    }
  }
--- !result
|
  {
    "took": 9,
    "timed_out": false,
    "_shards": ...,
    "hits": ...,
    "aggregations": {
      "interactions": {
        "buckets": [
          {
            "key":"grpA",
            "doc_count": 2
          },
          {
            "key":"grpA&grpB",
            "doc_count": 1
          },
          {
            "key":"grpB",
            "doc_count": 2
          },
          {
            "key":"grpB&grpC",
            "doc_count": 1
          },
          {
            "key":"grpC",
            "doc_count": 1
          }
        ]
      }
    }
  }
