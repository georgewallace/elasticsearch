--- !code
|
  GET sales/_search
  {
    "aggs": {
      "price_ranges": {
        "range": {
          "field": "price",
          "ranges": [
            { "to": 100 },
            { "from": 100, "to": 200 },
            { "from": 200 }
          ]
        },
        "aggs": {
          "price_stats": {
            "stats": { "field": "price" }
          }
        }
      }
    }
  }
