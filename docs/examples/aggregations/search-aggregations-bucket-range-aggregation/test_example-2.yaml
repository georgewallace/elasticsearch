--- !code
|
  GET sales/_search
  {
    "aggs": {
      "price_ranges": {
        "range": {
          "field": "price",
          "keyed": true,
          "ranges": [
            { "to": 100 },
            { "from": 100, "to": 200 },
            { "from": 200 }
          ]
        }
      }
    }
  }
--- !result
|
  {
    ...
    "aggregations": {
      "price_ranges": {
        "buckets": {
          "*-100.0": {
            "to": 100.0,
            "doc_count": 2
          },
          "100.0-200.0": {
            "from": 100.0,
            "to": 200.0,
            "doc_count": 2
          },
          "200.0-*": {
            "from": 200.0,
            "doc_count": 3
          }
        }
      }
    }
  }
