--- !metadata
id: example-6
language: elastic_console
topic: search-aggregations-bucket-range-aggregation
subtopic: default
example_order: 6
--- !code
|
  PUT metrics_index
  {
    "mappings": {
      "properties": {
        "network": {
          "properties": {
            "name": {
              "type": "keyword"
            }
          }
        },
        "latency_histo": {
           "type": "histogram"
        }
      }
    }
  }

  PUT metrics_index/_doc/1?refresh
  {
    "network.name" : "net-1",
    "latency_histo" : {
        "values" : [1, 3, 8, 12, 15],
        "counts" : [3, 7, 23, 12, 6]
     }
  }

  PUT metrics_index/_doc/2?refresh
  {
    "network.name" : "net-2",
    "latency_histo" : {
        "values" : [1, 6, 8, 12, 14],
        "counts" : [8, 17, 8, 7, 6]
     }
  }

  GET metrics_index/_search?size=0&filter_path=aggregations
  {
    "aggs": {
      "latency_ranges": {
        "range": {
          "field": "latency_histo",
          "ranges": [
            {"to": 2},
            {"from": 2, "to": 3},
            {"from": 3, "to": 10},
            {"from": 10}
          ]
        }
      }
    }
  }
--- !result
|
  {
    "aggregations": {
      "latency_ranges": {
        "buckets": [
          {
            "key": "*-2.0",
            "to": 2.0,
            "doc_count": 11
          },
          {
            "key": "2.0-3.0",
            "from": 2.0,
            "to": 3.0,
            "doc_count": 0
          },
          {
            "key": "3.0-10.0",
            "from": 3.0,
            "to": 10.0,
            "doc_count": 55
          },
          {
            "key": "10.0-*",
            "from": 10.0,
            "doc_count": 31
          }
        ]
      }
    }
  }
