--- !code
|
  POST /my-index-000001/_search
  {
    "size": 0,
    "runtime_mappings": {
      "message_and_context": {
        "type": "keyword",
        "script": """
          emit(doc['message.keyword'].value + ' ' + doc['context.keyword'].value)
        """
      }
    },
    "aggs": {
      "message_stats": {
        "string_stats": { "field": "message_and_context" }
      }
    }
  }
--- !result

