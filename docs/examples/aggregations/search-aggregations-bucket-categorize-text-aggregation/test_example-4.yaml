--- !metadata
id: example-4
language: elastic_console
topic: search-aggregations-bucket-categorize-text-aggregation
subtopic: default
example_order: 4
--- !code
|
  POST log-messages/_search?filter_path=aggregations
  {
    "aggs": {
      "daily": {
        "date_histogram": {
          "field": "time",
          "fixed_interval": "1d"
        },
        "aggs": {
          "categories": {
            "categorize_text": {
              "field": "message",
              "categorization_filters": ["\\w+\\_\\d{3}"]
            },
            "aggs": {
              "hit": {
                "top_hits": {
                  "size": 1,
                  "sort": ["time"],
                  "_source": "message"
                }
              }
            }
          }
        }
      }
    }
  }
