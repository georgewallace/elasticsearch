--- !metadata
id: example-2
language: elastic_console
topic: search-aggregations-metrics-boxplot-aggregation
subtopic: default
example_order: 2
--- !code
|
  GET latency/_search
  {
    "size": 0,
    "runtime_mappings": {
      "load_time.seconds": {
        "type": "long",
        "script": {
          "source": "emit(doc['load_time'].value / params.timeUnit)",
          "params": {
            "timeUnit": 1000
          }
        }
      }
    },
    "aggs": {
      "load_time_boxplot": {
        "boxplot": { "field": "load_time.seconds" }
      }
    }
  }
--- !result

