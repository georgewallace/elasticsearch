--- !metadata
id: example-1
language: elastic_console
topic: search-aggregations-pipeline-avg-bucket-aggregation
subtopic: default
example_order: 1
--- !code
|
  POST _search
  {
    "size": 0,
    "aggs": {
      "sales_per_month": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"
        },
        "aggs": {
          "sales": {
            "sum": {
              "field": "price"
            }
          }
        }
      },
      "avg_monthly_sales": {
  // tag::avg-bucket-agg-syntax[]               
        "avg_bucket": {
          "buckets_path": "sales_per_month>sales",
          "gap_policy": "skip",
          "format": "#,##0.00;(#,##0.00)"
        }
  // end::avg-bucket-agg-syntax[]               
      }
    }
  }
--- !result
