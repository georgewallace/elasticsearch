# Source: search-aggregations-pipeline-normalize-aggregation.md
--- !metadata
id: example-1
language: elastic_console
topic: search-aggregations-pipeline-normalize-aggregation
subtopic: default
example_order: 1
--- !code
|
  POST /sales/_search
  {
    "size": 0,
    "aggs": {
      "sales_per_month": {
        "date_histogram": {
          "field": "date",
          "calendar_interval": "month"
        },
        "aggs": {
          "sales": {
            "sum": {
              "field": "price"
            }
          },
          "percent_of_total_sales": {
            "normalize": {
              "buckets_path": "sales",          
              "method": "percent_of_sum",       
              "format": "00.00%"                
            }
          }
        }
      }
    }
  }
