--- !code
|
  PUT logs/_doc/4?refresh
  {
    "body": "info: user Bob logged out"
  }

  GET logs/_search
  {
    "size": 0,
    "aggs" : {
      "messages" : {
        "filters" : {
          "other_bucket_key": "other_messages",
          "filters" : {
            "errors" :   { "match" : { "body" : "error"   }},
            "warnings" : { "match" : { "body" : "warning" }}
          }
        }
      }
    }
  }
--- !result
|
  {
    "took": 3,
    "timed_out": false,
    "_shards": ...,
    "hits": ...,
    "aggregations": {
      "messages": {
        "buckets": {
          "errors": {
            "doc_count": 1
          },
          "warnings": {
            "doc_count": 2
          },
          "other_messages": {
            "doc_count": 1
          }
        }
      }
    }
  }
