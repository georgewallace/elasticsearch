--- !code
|
  PUT /logs/_bulk?refresh
  { "index" : { "_id" : 1 } }
  { "body" : "warning: page could not be rendered" }
  { "index" : { "_id" : 2 } }
  { "body" : "authentication error" }
  { "index" : { "_id" : 3 } }
  { "body" : "warning: connection timed out" }

  GET logs/_search
  {
    "size": 0,
    "aggs" : {
      "messages" : {
        "filters" : {
          "filters" : {
            "errors" :   { "match" : { "body" : "error"   }},
            "warnings" : { "match" : { "body" : "warning" }}
          }
        }
      }
    }
  }
--- !result
|
  {
    "took": 9,
    "timed_out": false,
    "_shards": ...,
    "hits": ...,
    "aggregations": {
      "messages": {
        "buckets": {
          "errors": {
            "doc_count": 1
          },
          "warnings": {
            "doc_count": 2
          }
        }
      }
    }
  }
