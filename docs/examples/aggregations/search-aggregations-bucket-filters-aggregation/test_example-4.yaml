--- !code
|
  POST /sales/_search?size=0&filter_path=aggregations
  {
    "aggs": {
      "the_filter": {
        "filters": {
          "keyed": false,
          "filters": {
            "t-shirt": { "term": { "type": "t-shirt" } },
            "hat": { "term": { "type": "hat" } }
          }
        },
        "aggs": {
          "avg_price": { "avg": { "field": "price" } },
          "sort_by_avg_price": {
            "bucket_sort": { "sort": { "avg_price": "asc" } }
          }
        }
      }
    }
  }
--- !result
|
  {
    "aggregations": {
      "the_filter": {
        "buckets": [
          {
            "key": "t-shirt",
            "doc_count": 3,
            "avg_price": { "value": 128.33333333333334 }
          },
          {
            "key": "hat",
            "doc_count": 3,
            "avg_price": { "value": 150.0 }
          }
        ]
      }
    }
  }
