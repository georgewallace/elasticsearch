--- !code
|
  POST /sales/_search
  {
    "size": 0,
    "runtime_mappings": {
      "price.adjusted": {
        "type": "double",
        "script": """
          double price = doc['price'].value;
          if (doc['promoted'].value) {
            price *= 0.8;
          }
          emit(price);
        """
      }
    },
    "aggs": {
      "max_price": {
        "max": { "field": "price.adjusted" }
      }
    }
  }
--- !result

