--- !code
|
  GET /_search
  {
    "size": 0,
    "aggs": {
      "my_buckets": {
        "composite": {
          "sources": [
            { "date": { "date_histogram": { "field": "timestamp", "calendar_interval": "1d", "order": "desc" } } },
            { "product": { "terms": { "field": "product" } } }
          ]
        },
        "aggregations": {
          "the_avg": {
            "avg": { "field": "price" }
          }
        }
      }
    }
  }
