--- !metadata
id: example-2
language: elastic_console
topic: search-aggregations-bucket-composite-aggregation
subtopic: default
example_order: 2
--- !code
|
  GET /_search
  {
    "runtime_mappings": {
      "day_of_week": {
        "type": "keyword",
        "script": """
          emit(doc['timestamp'].value.dayOfWeekEnum
            .getDisplayName(TextStyle.FULL, Locale.ENGLISH))
        """
      }
    },
    "size": 0,
    "aggs": {
      "my_buckets": {
        "composite": {
          "sources": [
            {
              "dow": {
                "terms": { "field": "day_of_week" }
              }
            }
          ]
        }
      }
    }
  }
--- !result

