--- !code
|
  POST /exams/_search
  {
    "size": 0,
    "runtime_mappings": {
      "grade.weighted": {
        "type": "double",
        "script": """
          emit(doc['grade'].value * doc['weight'].value)
        """
      }
    },
    "aggs": {
      "grades_stats": {
        "stats": {
          "field": "grade.weighted"
        }
      }
    }
  }
--- !result

