--- !code
|
  GET /products/_search?size=0
  {
    "query": {
      "match": {
        "name": "led tv"
      }
    },
    "aggs": {
      "resellers": {
        "nested": {
          "path": "resellers"
        },
        "aggs": {
          "min_price": {
            "min": {
              "field": "resellers.price"
            }
          }
        }
      }
    }
  }
--- !result
|
  {
    ...
    "aggregations": {
      "resellers": {
        "doc_count": 2,
        "min_price": {
          "value": 350.0
        }
      }
    }
  }
