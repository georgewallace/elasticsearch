--- !metadata
id: example-4
language: elastic_console
topic: search-aggregations-bucket-nested-aggregation
subtopic: default
example_order: 4
--- !code
|
  GET /products/_search?size=0
  {
    "query": {
      "match": {
        "name": "led tv"
      }
    },
    "aggs": {
      "resellers": {
        "nested": {
          "path": "resellers"
        },
        "aggs": {
          "filter_reseller": {
            "filter": {
              "bool": {
                "filter": [
                  {
                    "term": {
                      "resellers.reseller": "companyB"
                    }
                  }
                ]
              }
            },
            "aggs": {
              "min_price": {
                "min": {
                  "field": "resellers.price"
                }
              }
            }
          }
        }
      }
    }
  }
--- !result
|
  {
    ...
    "aggregations": {
      "resellers": {
        "doc_count": 2,
        "filter_reseller": {
          "doc_count": 1,
          "min_price": {
            "value": 500.0
          }
        }
      }
    }
  }
