--- !code
|
  POST /sales/_search?size=0
  {
    "query": {
      "constant_score": { "filter": { "range": { "price": { "lte": "500" } } } }
    },
    "aggs": {
      "prices": {
        "histogram": {
          "field": "price",
          "interval": 50,
          "hard_bounds": {
            "min": 100,
            "max": 200
          }
        }
      }
    }
  }
--- !result

