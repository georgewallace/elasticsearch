--- !metadata
id: example-7
language: elastic_console
topic: search-aggregations-bucket-histogram-aggregation
subtopic: default
example_order: 7
--- !code
|
  PUT metrics_index
  {
    "mappings": {
      "properties": {
        "network": {
          "properties": {
            "name": {
              "type": "keyword"
            }
          }
        },
        "latency_histo": {
           "type": "histogram"
        }
      }
    }
  }

  PUT metrics_index/_doc/1?refresh
  {
    "network.name" : "net-1",
    "latency_histo" : {
        "values" : [1, 3, 8, 12, 15],
        "counts" : [3, 7, 23, 12, 6]
     }
  }

  PUT metrics_index/_doc/2?refresh
  {
    "network.name" : "net-2",
    "latency_histo" : {
        "values" : [1, 6, 8, 12, 14],
        "counts" : [8, 17, 8, 7, 6]
     }
  }

  POST /metrics_index/_search?size=0
  {
    "aggs": {
      "latency_buckets": {
        "histogram": {
          "field": "latency_histo",
          "interval": 5
        }
      }
    }
  }
