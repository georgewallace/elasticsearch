# Source: elasticsearch-plugins/analysis-kuromoji-speech.md
--- !metadata
id: example-1
language: elastic_console
topic: analysis-kuromoji-speech
subtopic: default
example_order: 1
--- !code
|
  PUT kuromoji_sample
  {
    "settings": {
      "index": {
        "analysis": {
          "analyzer": {
            "my_analyzer": {
              "tokenizer": "kuromoji_tokenizer",
              "filter": [
                "my_posfilter"
              ]
            }
          },
          "filter": {
            "my_posfilter": {
              "type": "kuromoji_part_of_speech",
              "stoptags": [
                "助詞-格助詞-一般",
                "助詞-終助詞"
              ]
            }
          }
        }
      }
    }
  }

  GET kuromoji_sample/_analyze
  {
    "analyzer": "my_analyzer",
    "text": "寿司がおいしいね"
  }
--- !result
|
  {
    "tokens" : [ {
      "token" : "寿司",
      "start_offset" : 0,
      "end_offset" : 2,
      "type" : "word",
      "position" : 0
    }, {
      "token" : "おいしい",
      "start_offset" : 3,
      "end_offset" : 7,
      "type" : "word",
      "position" : 2
    } ]
  }
