# Source: elasticsearch-plugins/mapper-annotated-text-usage.md
--- !metadata
id: example-3
language: elastic_console
topic: mapper-annotated-text-usage
subtopic: default
example_order: 3
--- !code
|
  PUT idx
  {
    "settings": {
      "index": {
        "mapping": {
          "source": {
            "mode": "synthetic"
          }
        }
      }
    },
    "mappings": {
      "properties": {
        "text": {
          "type": "annotated_text",
          "fields": {
            "raw": {
              "type": "keyword"
            }
          }
        }
      }
    }
  }
  PUT idx/_doc/1
  {
    "text": [
      "the quick brown fox",
      "the quick brown fox",
      "jumped over the lazy dog"
    ]
  }
  GET idx/_doc/1
--- !result
|
  {
    ...
    "_source": {

      "text": [
        "jumped over the lazy dog",
        "the quick brown fox"
      ]
    }
  }
