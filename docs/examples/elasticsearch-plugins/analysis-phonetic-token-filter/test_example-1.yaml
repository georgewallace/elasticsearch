# Source: elasticsearch-plugins/analysis-phonetic-token-filter.md
--- !metadata
id: example-1
language: elastic_console
topic: analysis-phonetic-token-filter
subtopic: default
example_order: 1
--- !code
|
  PUT phonetic_sample
  {
    "settings": {
      "index": {
        "analysis": {
          "analyzer": {
            "my_analyzer": {
              "tokenizer": "standard",
              "filter": [
                "lowercase",
                "my_metaphone"
              ]
            }
          },
          "filter": {
            "my_metaphone": {
              "type": "phonetic",
              "encoder": "metaphone",
              "replace": false
            }
          }
        }
      }
    }
  }

  GET phonetic_sample/_analyze
  {
    "analyzer": "my_analyzer",
    "text": "Joe Bloggs" 
  }
--- !result

