--- !code
|
  PUT /polish_stop_example
  {
    "settings": {
      "index": {
        "analysis": {
          "analyzer": {
            "analyzer_with_stop": {
              "tokenizer": "standard",
              "filter": [
                "lowercase",
                "polish_stop"
              ]
            }
          },
          "filter": {
            "polish_stop": {
              "type": "polish_stop",
              "stopwords": [
                "_polish_",
                "jeść"
              ]
            }
          }
        }
      }
    }
  }

  GET polish_stop_example/_analyze
  {
    "analyzer": "analyzer_with_stop",
    "text": "Gdzie kucharek sześć, tam nie ma co jeść."
  }
