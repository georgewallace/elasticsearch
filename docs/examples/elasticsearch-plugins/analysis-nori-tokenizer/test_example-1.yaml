# Source: elasticsearch-plugins/analysis-nori-tokenizer.md
--- !metadata
id: example-1
language: elastic_console
topic: analysis-nori-tokenizer
subtopic: default
example_order: 1
--- !code
|
  PUT nori_sample
  {
    "settings": {
      "index": {
        "analysis": {
          "tokenizer": {
            "nori_user_dict": {
              "type": "nori_tokenizer",
              "decompound_mode": "mixed",
              "discard_punctuation": "false",
              "user_dictionary": "userdict_ko.txt",
              "lenient": "true"
            }
          },
          "analyzer": {
            "my_analyzer": {
              "type": "custom",
              "tokenizer": "nori_user_dict"
            }
          }
        }
      }
    }
  }

  GET nori_sample/_analyze
  {
    "analyzer": "my_analyzer",
    "text": "세종시"  
  }
