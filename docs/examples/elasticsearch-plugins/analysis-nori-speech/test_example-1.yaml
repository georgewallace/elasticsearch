example_order: 1
--- !code
|
  PUT nori_sample
  {
    "settings": {
      "index": {
        "analysis": {
          "analyzer": {
            "my_analyzer": {
              "tokenizer": "nori_tokenizer",
              "filter": [
                "my_posfilter"
              ]
            }
          },
          "filter": {
            "my_posfilter": {
              "type": "nori_part_of_speech",
              "stoptags": [
                "NR"   
              ]
            }
          }
        }
      }
    }
  }

  GET nori_sample/_analyze
  {
    "analyzer": "my_analyzer",
    "text": "여섯 용이"  
  }
