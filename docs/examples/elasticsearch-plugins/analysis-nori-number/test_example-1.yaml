--- !metadata
id: example-1
language: elastic_console
topic: analysis-nori-number
subtopic: default
example_order: 1
--- !code
|
  PUT nori_sample
  {
    "settings": {
      "index": {
        "analysis": {
          "analyzer": {
            "my_analyzer": {
              "tokenizer": "tokenizer_discard_puncuation_false",
              "filter": [
                "part_of_speech_stop_sp", "nori_number"
              ]
            }
          },
          "tokenizer": {
            "tokenizer_discard_puncuation_false": {
              "type": "nori_tokenizer",
              "discard_punctuation": "false"
            }
          },
          "filter": {
              "part_of_speech_stop_sp": {
                  "type": "nori_part_of_speech",
                  "stoptags": ["SP"]
              }
          }
        }
      }
    }
  }

  GET nori_sample/_analyze
  {
    "analyzer": "my_analyzer",
    "text": "십만이천오백과 ３.２천"
  }
