--- !metadata
id: example-1
language: elastic_console
topic: analysis-kuromoji-stemmer
subtopic: default
example_order: 1
--- !code
|
  PUT kuromoji_sample
  {
    "settings": {
      "index": {
        "analysis": {
          "analyzer": {
            "my_analyzer": {
              "tokenizer": "kuromoji_tokenizer",
              "filter": [
                "my_katakana_stemmer"
              ]
            }
          },
          "filter": {
            "my_katakana_stemmer": {
              "type": "kuromoji_stemmer",
              "minimum_length": 4
            }
          }
        }
      }
    }
  }

  GET kuromoji_sample/_analyze
  {
    "analyzer": "my_analyzer",
    "text": "コピー" 
  }

  GET kuromoji_sample/_analyze
  {
    "analyzer": "my_analyzer",
    "text": "サーバー" 
  }
