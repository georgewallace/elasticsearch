--- !metadata
id: example-1
language: elastic_console
topic: analysis-icu-transform
subtopic: default
example_order: 1
--- !code
|
  PUT icu_sample
  {
    "settings": {
      "index": {
        "analysis": {
          "analyzer": {
            "latin": {
              "tokenizer": "keyword",
              "filter": [
                "myLatinTransform"
              ]
            }
          },
          "filter": {
            "myLatinTransform": {
              "type": "icu_transform",
              "id": "Any-Latin; NFD; [:Nonspacing Mark:] Remove; NFC" 
            }
          }
        }
      }
    }
  }

  GET icu_sample/_analyze
  {
    "analyzer": "latin",
    "text": "你好" 
  }

  GET icu_sample/_analyze
  {
    "analyzer": "latin",
    "text": "здравствуйте" 
  }

  GET icu_sample/_analyze
  {
    "analyzer": "latin",
    "text": "こんにちは" 
  }
