--- !metadata
id: example-2
language: elastic_console
topic: analysis-icu-tokenizer
subtopic: default
example_order: 2
--- !code
|
  PUT icu_sample
  {
    "settings": {
      "index": {
        "analysis": {
          "tokenizer": {
            "icu_user_file": {
              "type": "icu_tokenizer",
              "rule_files": "Latn:KeywordTokenizer.rbbi"
            }
          },
          "analyzer": {
            "my_analyzer": {
              "type": "custom",
              "tokenizer": "icu_user_file"
            }
          }
        }
      }
    }
  }

  GET icu_sample/_analyze
  {
    "analyzer": "my_analyzer",
    "text": "Elasticsearch. Wow!"
  }
--- !result
|
  {
     "tokens": [
        {
           "token": "Elasticsearch. Wow!",
           "start_offset": 0,
           "end_offset": 19,
           "type": "<ALPHANUM>",
           "position": 0
        }
     ]
  }
