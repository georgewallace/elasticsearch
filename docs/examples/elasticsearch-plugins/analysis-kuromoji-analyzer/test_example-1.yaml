--- !metadata
id: example-1
language: elastic_console
topic: analysis-kuromoji-analyzer
subtopic: default
example_order: 1
--- !code
|
  PUT index-00001
  {
    "settings": {
      "index": {
        "analysis": {
          "analyzer": {
            "kuromoji_normalize": {                 
              "char_filter": [
                "icu_normalizer"                    
              ],
              "tokenizer": "kuromoji_tokenizer",
              "filter": [
                "kuromoji_baseform",
                "kuromoji_part_of_speech",
                "cjk_width",
                "ja_stop",
                "kuromoji_stemmer",
                "lowercase"
              ]
            }
          }
        }
      }
    }
  }
--- !result

