  PUT icu_sample
  {
    "settings": {
      "index": {
        "analysis": {
          "analyzer": {
            "swedish_analyzer": {
              "tokenizer": "icu_tokenizer",
              "filter": [
                "swedish_folding",
                "lowercase"
              ]
            }
          },
          "filter": {
            "swedish_folding": {
              "type": "icu_folding",
              "unicode_set_filter": "[^åäöÅÄÖ]"
            }
          }
        }
      }
    }
  }
